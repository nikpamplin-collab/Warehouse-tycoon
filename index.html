function all(){return [state.player,...state.rivals]};function active(c){return !c.bankrupt};function regionOf(id){return regions.find(r=>r.id===id)||regions[0]};function siteSpace(s){return s.sections*250+s.racks*250+s.automated*1250};function siteProductivity(s){return C.moves*s.ci*(1+.5*s.automated/s.sections)};function siteCapacity(s){return Math.round(s.staff*siteProductivity(s))};function siteOverhead(s){let base=regionOf(s.region).overhead,sum=0;for(let i=0;i<s.sections;i++)sum+=base*Math.pow(.9,i);return sum};function contracts(s,m=state.month){return s.contracts.filter(k=>k.end>=m&&k.start<=m)};function committed(s,m=state.month){return s.contracts.filter(k=>k.end>=m)};function occupancy(s){return committed(s).reduce((a,k)=>a+k.spaces,0)};function forecast(s){return committed(s).reduce((a,k)=>a+k.moves,0)};function total(c,fn){return c.sites.reduce((a,s)=>a+fn(s),0)};function owned(c,r){return c.sites.filter(s=>s.region===r)};function cash(c){return money(c.cash)};

function aiPrepare(c){if(c.bankrupt)return;let m=state.month,profile=c.ai||profiles[1],growth=profile.growth||1;let monthlyCosts=total(c,s=>siteOverhead(s)+s.staff*C.staff*(s.region==='south'?1.75:1)+(s.hs?C.hs:0))+c.debt*C.interest;let reserve=Math.max(100000,monthlyCosts*3);let surplus=()=>c.cash-reserve;let recent=c.history.slice(-12),annualProfit=recent.reduce((a,r)=>a+r.profit,0),profitable=recent.length<4||annualProfit>0;let lastInvestment=c.lastInvestment??0;for(let s of c.sites){let f=forecast(s);s.staff=Math.min(150,Math.ceil(f*1.08/Math.max(1,siteProductivity(s))));s.hs=profile.service>.85||c.cash>250000;let occupied=occupancy(s),free=siteSpace(s)-occupied;let pendingRacks=s.projects.filter(p=>p.type==='Racking').length;if(free<Math.max(500,siteSpace(s)*.22)&&s.racks+pendingRacks<s.sections*9&&surplus()>C.rack){s.projects.push({type:'Racking',remaining:1,cost:C.rack});c.cash-=C.rack;c.lastInvestment=m;}if(s.automated+s.projects.filter(p=>p.type==='Automation').length<s.sections&&surplus()>C.auto+monthlyCosts&&f>siteCapacity(s)*.7&&m%3===0){s.projects.push({type:'Automation',remaining:3,cost:C.auto});c.cash-=C.auto;c.lastInvestment=m;}if(m-s.ciStart>=12&&f>8000&&surplus()>ciCost(s)+monthlyCosts&&m%3===0){let cost=ciCost(s);c.cash-=cost;s.projects.push({type:'CI',remaining:3,cost});s.ciStart=m;c.lastInvestment=m;}}if(m%3===0){let sites=[...c.sites].sort((a,b)=>(occupancy(b)/Math.max(1,siteSpace(b)))-(occupancy(a)/Math.max(1,siteSpace(a))));for(let s of sites){let occ=occupancy(s)/Math.max(1,siteSpace(s));let target=profitable?.58:.78;let pressure=occ>Math.max(.68,target)||siteSpace(s)-occupancy(s)<1000&&occ>.4;let noGrowth=m-lastInvestment>=6&&surplus()>monthlyCosts*3&&occ>.55;let demandEvidence=forecast(s)>0||recent.some(r=>r.profit>0);if((pressure||noGrowth&&demandEvidence)&&surplus()>C.expand+monthlyCosts*(profitable?1:2)&&s.sections+s.projects.filter(p=>p.type==='Expansion').length<24&&!s.projects.some(p=>p.type==='Expansion')){s.projects.push({type:'Expansion',remaining:2,cost:C.expand});c.cash-=C.expand;c.lastInvestment=m;state.events.push(c.name+' commissioned a 25,000 sq ft expansion in '+regionOf(s.region).name+'.');break;}}let missing=regions.filter(r=>!owned(c,r.id).length);if(missing.length&&profitable&&surplus()>Math.max(...missing.map(r=>r.cost))+monthlyCosts*3&&m-lastInvestment>=3){let r=missing.sort((a,b)=>a.cost-b.cost)[0];c.cash-=r.cost;c.sites.push(site(r.id));c.lastInvestment=m;state.events.push(c.name+' opened a new warehouse in '+r.name+'.');}}if(c.cash<50000&&c.debt<C.loan){let n=Math.min(50000,C.loan-c.debt);c.cash+=n;c.debt+=n;}c.aiReview={annualProfit,targetMargin:profile.margin||.12,reserve,investable:Math.max(0,surplus())};}
function aiOffer(c,t){let s=availableSite(c,t);if(!s||c.bankrupt)return null;let hard=t.region==='mid'?1:(t.region==='north'?.78:.46),base=c.ai.price*hard;let annual=c.history.slice(-12),p=annual.reduce((a,r)=>a+r.profit,0);let revenue=annual.reduce((a,r)=>a+r.storage+r.handling,0),margin=revenue?p/revenue:0,target=c.ai.margin||.12;let factor=base*(annual.length>=3&&margin<target?1.06:1)*rand(.95,1.045);return {c,s,storage:Math.round(C.storage*factor*100)/100,handling:Math.round(C.handling*factor*100)/100};}

function progress(c){let updates=[];for(let s of c.sites){let done={};for(let p of [...s.projects]){p.remaining--;if(p.remaining<=0){if(p.type==='Racking')s.racks++;if(p.type==='Expansion')s.sections++;if(p.type==='Automation')s.automated++;if(p.type==='CI'){let gain=rand(.01,.08);s.ci*=1+gain;updates.push(regionOf(s.region).name+': CI completed, productivity +'+(gain*100).toFixed(1)+'%.');}else done[p.type]=(done[p.type]||0)+1;s.projects.splice(s.projects.indexOf(p),1);}else updates.push(regionOf(s.region).name+': '+p.type+' '+p.remaining+' month'+(p.remaining===1?'':'s')+' remaining.');}for(let [k,v] of Object.entries(done))updates.push(regionOf(s.region).name+': '+v+' '+k.toLowerCase()+' installation'+(v===1?'':'s')+' completed.');}return updates;}
function companyMonth(c,m){if(c.bankrupt)return null;let results=c.sites.map(s=>runSite(c,s,m));let record={month:m,storage:0,handling:0,rent:0,labour:0,hs:0,incidentCost:0,forecast:0,demand:0,capacity:0,handled:0,missed:0,spaces:0,profit:0,interest:c.debt*C.interest};for(let r of results)for(let k of ['storage','handling','rent','labour','hs','incidentCost','forecast','demand','capacity','handled','missed','spaces','profit'])record[k]+=r[k];record.profit-=record.interest;record.principal=Math.min(c.debt,Math.ceil(c.debt/36));c.cash+=record.profit-record.principal;c.debt-=record.principal;record.cash=c.cash;record.operatingCashFlow=record.profit;record.financingCashFlow=-record.principal;record.investmentCashFlow=0;record.cashBeforeMonth=record.cash-record.profit+record.principal;record.incidents=results.flatMap(r=>r.incident?[r.incident]:[]);if(record.missed>record.demand*.07&&record.demand>0)c.rep=clamp(c.rep-1,1,10);else if(record.demand&&record.missed===0&&m%3===0)c.rep=clamp(c.rep+1,1,10);if(c.cash< -C.overdraft)c.bankrupt=true;c.last=record;c.history.push(record);return record;}

function objectives(c){let a=rolling(c),sc=scorecard(c),territories=new Set(c.sites.map(s=>s.region)).size;return [{id:'profit3',label:'Three profitable months',done:c.history.slice(-3).length===3&&c.history.slice(-3).every(r=>r.profit>0)},{id:'annualprofit',label:'£1m rolling 12-month profit',done:a.months===12&&a.profit>=1000000},{id:'service',label:'98% monthly service',done:!!c.last?.demand&&sc.service>=.98},{id:'regions',label:'Operate in all three regions',done:territories===3},{id:'national',label:'£2m annual profit and three regions',done:a.months===12&&a.profit>=2000000&&territories===3}];}
function priorities(){let c=state.player,out=[],monthlyCosts=total(c,s=>siteOverhead(s)+s.staff*C.staff*(s.region==='south'?1.75:1)+(s.hs?C.hs:0))+c.debt*C.interest;if(c.cash<monthlyCosts*3)out.push({level:3,text:'Cash reserve below three months of fixed costs.',action:'Review costs and financing',tab:'history'});for(let s of c.sites){let o=occupancy(s)/Math.max(1,siteSpace(s)),h=forecast(s)/Math.max(1,siteCapacity(s));if(o>.9)out.push({level:2,text:(s.name||regionOf(s.region).name)+' at '+Math.round(o*100)+'% pallet occupancy.',action:'Review storage investment',tab:'warehouse'});if(h>.9)out.push({level:2,text:(s.name||regionOf(s.region).name)+' handling demand is '+Math.round(h*100)+'% of capacity.',action:'Review workforce',tab:'warehouse'});if(s.contracts.some(k=>k.end>=state.month&&k.end<=state.month+2))out.push({level:1,text:(s.name||regionOf(s.region).name)+' has contracts expiring within two months.',action:'Review contract book',tab:'history'});}let bids=state.tenders.filter(t=>availableSite(c,t)).length;if(bids)out.push({level:1,text:bids+' tenders have suitable available warehouse space.',action:'Review tenders',tab:'market'});return out.sort((a,b)=>b.level-a.level).slice(0,3);}

function investmentForecast(type){let s=selectedSite();if(!s)return;let cost=type==='Racking'?C.rack:type==='Expansion'?C.expand:type==='Automation'?C.auto:ciCost(s),months=type==='Racking'?1:type==='Expansion'?2:3,spaces=type==='Racking'?250:type==='Expansion'?250:0,extraMoves=type==='Automation'?Math.round(s.staff*C.moves*s.ci*.5/Math.max(1,s.sections)):type==='CI'?Math.round(siteCapacity(s)*.045):0;let free=siteSpace(s)-occupancy(s),unmet=Math.max(0,forecast(s)-siteCapacity(s));dialog('<h2>'+esc(type)+' investment appraisal</h2><p>Capital cost <b>'+fmt(cost)+'</b> · Lead time <b>'+months+' month(s)</b></p><p>Additional pallet locations: '+num(spaces)+' · Indicative handling uplift: '+num(extraMoves)+' moves/month.</p><p>Current free pallet locations: '+num(free)+' · Forecast handling shortfall: '+num(unmet)+' moves/month.</p><p>Cash remaining after investment: <b>'+money(state.player.cash-cost)+'</b></p><p class="muted">Extra capacity does not automatically create revenue. Payback depends on future contracts and actual operating costs. CI gains vary and the uplift shown is illustrative.</p><div class="modal-actions"><button class="btn secondary" onclick="closeDialog()">Close appraisal</button></div>');}

function nextMonth(){if(state.finished)return;repairBankruptRivals();if(state.eventOffer)return alert('Choose an outcome for the current event first.');state.events=[];for(let c of state.rivals)aiPrepare(c);let results=resolveTenders(),m=state.month,progressNotes=[];let emergency=[];for(let c of [...all()]){let was=c.bankrupt,record=companyMonth(c,m);if(c!==state.player&&record&&m%12===0){let payout=Math.max(0,record.profit*2);let stake=shares(c)/100;let dividend=Math.min(Math.max(0,c.cash),payout)*stake;c.cash-=dividend;state.player.cash+=dividend;if(dividend>0)state.log.unshift('Dividend from '+c.name+': '+fmt(dividend)+'.');}let updates=progress(c);if(c===state.player)progressNotes=updates;if(!was&&c.bankrupt){if(c===state.player)state.finished=true;else {let before=state.tenders.length;bankruptcy(c);emergency.push(...state.tenders.slice(before));replaceBankruptRival(c);}}}state.log=[...state.events,...progressNotes,...results.map(x=>x.text),...state.log].slice(0,70);state.month++;state.tenders=[...makeTenders(state),...emergency];for(let offer of state.bankruptOffers){if(offer.expires>=state.month){for(let t of offer.sites){/* asset offers remain available until expiry */}}}state.bankruptOffers=state.bankruptOffers.filter(o=>o.expires>=state.month);state.bids={};gameplayTick();state.milestones ||= [];for(let objective of objectives(state.player))if(objective.done&&!state.milestones.includes(objective.id)){state.milestones.push(objective.id);state.log.unshift('OBJECTIVE ACHIEVED: '+objective.label+'.');}save();tab='office';render();report(results,progressNotes);}

function cancelProject(index){let s=selectedSite(),p=s?.projects[index];if(!p)return;let costs={Racking:C.rack,Expansion:C.expand,Automation:C.auto,CI:ciCost(s)};let refund=Math.round((p.cost??costs[p.type]??0)*.75);if(!confirm('Cancel '+p.type+'? You will recover '+fmt(refund)+' (75% of project cost).'))return;state.player.cash+=refund;s.projects.splice(index,1);if(p.type==='CI')s.ciStart=state.month-12;state.log.unshift('Cancelled '+p.type+' project at '+regionOf(s.region).name+'.');save();render();}function project(type,cost,months){let s=selectedSite();if(!s||state.player.cash<cost)return alert('Not enough cash.');state.player.cash-=cost;s.projects.push({type,remaining:months,cost});if(type==='CI')s.ciStart=state.month;save();render();}

function warehouseGraphic(s){let n=Math.min(6,Math.max(2,s.sections+2));return '<div class="warehouse-art"><div class="art-sky"></div><div class="art-building"><div class="art-roof"></div><div class="art-name">'+esc(s.name||regionOf(s.region).name+' DC')+'</div><div class="art-docks">'+Array.from({length:n},()=>'<span class="dock"></span>').join('')+'</div></div><div class="art-yard"><span>🚚</span><span>📦</span><span>🚛</span></div></div>';}
function trendChart(){let h=state.player.history.slice(-9),values=h.map(r=>r.storage+r.handling),profits=h.map(r=>r.profit);if(!h.length)return '<p class="muted">Complete a month to see your revenue and profit trends.</p>';let max=Math.max(1,...values,...profits),min=Math.min(0,...profits),span=max-min||1;let line=arr=>arr.map((v,i)=>(24+i*(352/Math.max(1,arr.length-1))).toFixed(1)+','+(138-(v-min)/span*110).toFixed(1)).join(' ');return '<svg viewBox="0 0 400 165" role="img" aria-label="Revenue and profit trend"><line x1="20" y1="140" x2="384" y2="140" stroke="#57718b"/><polyline fill="none" stroke="#64c7ff" stroke-width="4" stroke-linejoin="round" points="'+line(values)+'"/><polyline fill="none" stroke="#4fe0aa" stroke-width="4" stroke-linejoin="round" points="'+line(profits)+'"/></svg><div class="chart-legend"><span>● Revenue</span><span>● Profit</span></div>';}
function visualOverview(){let c=state.player,s=c.sites.find(x=>x.id===selectedSiteId)||c.sites[0];return '<div class="visual-grid"><div class="panel visual-hero"><h2>🏭 Your warehouse network</h2>'+warehouseGraphic(s)+'<div class="row"><b>'+esc(s.name||regionOf(s.region).name)+' · '+num(siteSpace(s))+' pallet spaces</b><button class="btn secondary" onclick="go(\'warehouse\')">Manage warehouse</button></div>'+capacityGauge(s)+'</div><div class="panel"><h2>📈 Business performance</h2><div class="visual-stats"><div><small>Revenue this month</small><strong>'+fmt((c.last?.storage||0)+(c.last?.handling||0))+'</strong></div><div><small>Profit this month</small><strong>'+money(c.last?.profit||0)+'</strong></div><div><small>Company value</small><strong>'+fmt(valuation(c))+'</strong></div></div>'+trendChart()+'</div></div><div class="panel"><h2>🗺️ Territory snapshot</h2><div class="territory-cards">'+regions.map(r=>{let sites=owned(c,r.id),f=sites.reduce((a,x)=>a+forecast(x),0),cap=sites.reduce((a,x)=>a+siteCapacity(x),0),pct=cap?Math.round(100*f/cap):0;return '<button class="territory-card" onclick="selected=\''+r.id+'\';go(\'warehouse\')"><b>'+esc(r.name)+'</b><span>'+sites.length+' site(s)</span><small>'+(sites.length?num(f)+' / '+num(cap)+' movements':'Not yet open')+'</small>'+(sites.length?meter(pct,pct>100?'#ff7777':pct>80?'#f2b65d':'#4ac7a3'):'')+'</button>';}).join('')+'</div></div><div class="panel"><h2>🎮 What’s happening</h2>'+((state.eventOffer)?'<div class="notice"><b>Decision needed:</b> '+esc(state.eventOffer.title)+'<p>'+esc(state.eventOffer.description)+'</p><button class="btn" onclick="showEvent()">Choose response</button></div>':'')+'<p class="muted">'+esc(state.latestCompetitor||'Competitors are bidding for business across the UK.')+'</p><p class="muted">'+esc(state.latestAchievement||'Grow your business to unlock milestones.')+'</p></div>';}
function gameplayTick(){let c=state.player,m=state.month;state.achievements ||= [];let milestones=[['first-win',c.sites.some(s=>s.contracts.length),'Milestone: First customer contract won!'],['million',c.history.some(r=>r.storage+r.handling>=1000000),'Milestone: £1m monthly revenue reached!'],['three-sites',c.sites.length>=3,'Milestone: Three warehouses operating!'],['profit',c.history.some(r=>r.profit>=100000),'Milestone: £100k monthly profit reached!']];for(let [id,yes,message] of milestones)if(yes&&!state.achievements.includes(id)){state.achievements.push(id);state.latestAchievement=message;state.log.unshift(message);}if(m%3===0){let activeRivals=state.rivals.filter(x=>!x.bankrupt&&x.sites.length);let rival=activeRivals.length?pick(activeRivals):null;if(rival){state.latestCompetitor='Competitor update: '+rival.name+' is active in '+regionOf(pick(rival.sites).region).name+'.';state.log.unshift(state.latestCompetitor);}}if(m%4===0&&!state.eventOffer&&!c.bankrupt){state.eventOffer={title:'Unexpected customer request',description:'A customer offers a one-off urgent job. Do you take the extra work?',choices:['Accept extra work','Quote a premium','Decline the request']};}}
function showEvent(){let e=state.eventOffer;if(!e)return;dialog('<h2>Unexpected event</h2><p>'+esc(e.description)+'</p>'+e.choices.map((v,i)=>'<button class="btn full '+(i?'secondary':'')+'" style="margin:6px 0" onclick="resolveEvent('+i+')">'+esc(v)+'</button>').join('')+'<div class="modal-actions"><button class="btn secondary" onclick="closeDialog()">Decide later</button></div>');}
function resolveEvent(choice){if(!state.eventOffer)return;let c=state.player,notes=['You accepted the job: £12,000 earned, but paid £5,000 in extra labour.','You quoted a premium. The customer '+(Math.random()<.5?'accepted: £14,000 net earned.':'declined: no change.') ,'You declined the work and protected existing capacity.'];if(choice===0)c.cash+=7000;if(choice===1){let won=Math.random()<.5;if(won)c.cash+=14000;notes[1]=won?'Your premium quote was accepted: £14,000 net earned.':'Your premium quote was declined: no change.';}state.log.unshift('EVENT: '+notes[choice]);state.eventOffer=null;save();closeDialog();render();}
function header(){let c=state.player;document.querySelector('header h1').textContent='🏭 '+c.name;document.getElementById('headline').textContent=monthName(state.month)+' · '+num(total(c,s=>s.sections*25000))+' sq ft · '+(state.finished?'Bankrupt':'UK logistics operator');document.getElementById('metrics').innerHTML=[['Cash',cash(c)],['Monthly profit',c.last?money(c.last.profit):'—'],['Pallet spaces',num(total(c,siteSpace))],['Reputation',face(c.rep)],['Estimated company value',fmt(valuation(c))]].map(([k,v])=>'<div class="metric"><label>'+k+'</label><strong>'+v+'</strong></div>').join('');let tabs=[['office','Office'],['market','Tenders'],['warehouse','Warehouses'],['rivals','Rivals'],['history','Finances']];document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');}
function go(k){tab=k;render()};function meter(value,color='#4ac7a3'){return '<div class="bar"><span style="width:'+clamp(value,0,100)+'%;background:'+color+'"></span></div>'};
function miniSite(s){let occ=siteSpace(s)?100*occupancy(s)/siteSpace(s):0,auto=100*s.automated/s.sections;return '<div class="mini-site"><div class="row"><b>'+esc(s.name||regionOf(s.region).name)+'</b><small>'+num(s.sections*25000)+' sq ft</small></div><div class="tilegrid">'+Array.from({length:20},(_,i)=>'<i class="'+(i<Math.round(occ/5)?'filled':'')+(i<Math.round(auto/5)?' automated':'')+'"></i>').join('')+'</div><div class="row"><small>Occupied '+Math.round(occ)+'%</small><small>Automated '+Math.round(auto)+'%</small></div></div>'};
function openMapSite(i){let site=state.player.sites[i];if(!site)return;selectedSiteId=site.id;selected=site.region;go('warehouse');}
function networkMap(){let c=state.player,positions={north:[145,138],mid:[172,215],south:[205,280]},counts={north:0,mid:0,south:0};let pins=c.sites.map((site,i)=>{let k=counts[site.region]++,base=positions[site.region]||positions.mid,x=base[0]+(k%3-1)*16,y=base[1]+Math.floor(k/3)*18,cap=siteCapacity(site),used=forecast(site),ratio=cap?used/cap:(used?2:0),color=ratio>1?'#ff7777':ratio>.8?'#f2b65d':'#4ac7a3';return `<g class="network-pin" role="button" tabindex="0" aria-label="${esc(site.name)}" onclick="openMapSite(${i})" onkeydown="if(event.key==='Enter')openMapSite(${i})" transform="translate(${x},${y})"><circle r="13" fill="${color}" stroke="#0b2235" stroke-width="2"/><path d="M-7 5V-4L0-8 7-4V5H-7 M-3 5V0H3V5" fill="none" stroke="#102738" stroke-width="2"/><title>${esc(site.name)}</title></g>`;}).join('');let items=c.sites.map((site,i)=>`<button class="network-site" onclick="openMapSite(${i})"><b>🏭 ${esc(site.name)}</b><small>${esc(regionOf(site.region).name)} · ${num(forecast(site))} / ${num(siteCapacity(site))} pallet moves per month</small></button>`).join('');return `<div class="panel"><h2>UK warehouse locations</h2><p class="muted">Geographic UK outline; site pins are placed at illustrative regional centres, not precise addresses. Select a site to manage it.</p><div class="network-layout"><svg class="uk-network" viewBox="0 0 310 350" role="img" aria-label="Map of Great Britain and Northern Ireland with ${c.sites.length} regional warehouse markers"><path d="M95.2 201.3 L79.0 195.4 L65.7 195.8 L70.1 180.2 L65.7 164.7 L83.7 163.5 L106.8 181.4 L95.2 201.3 Z M162.0 214.8 L165.2 197.9 L150.5 179.7 L124.4 174.6 L119.2 166.7 L127.0 153.8 L120.0 145.8 L108.4 159.5 L107.1 131.5 L96.3 116.7 L104.1 86.8 L120.8 63.2 L138.0 65.5 L163.9 63.1 L140.9 94.5 L162.8 90.5 L186.4 90.6 L180.8 114.3 L161.4 140.3 L183.7 142.1 L204.5 179.4 L219.2 184.0 L232.5 217.1 L238.6 228.5 L264.7 234.1 L262.0 252.6 L251.1 261.1 L259.7 276.1 L240.3 291.3 L211.6 291.0 L175.0 299.0 L164.9 293.3 L150.7 306.9 L130.8 303.6 L115.7 314.7 L104.3 308.9 L135.8 278.4 L155.1 272.1 L121.3 267.3 L115.3 255.7 L137.7 246.8 L125.9 231.1 L130.0 212.1 L162.0 214.8 Z" fill="#295d77" stroke="#7ab4d3" stroke-width="2" stroke-linejoin="round"/>${pins}</svg><div class="network-list">${items}</div></div><p class="muted">Green: available capacity · Amber: nearing capacity · Red: overloaded</p></div>`;}
function office(){let c=state.player,sites=c.sites;return '<div class="panel round-action"><div class="row"><b>Complete this month</b><small>'+Object.keys(state.bids).length+' / '+state.tenders.length+' tenders bid</small></div><button class="btn full" '+(state.finished?'disabled':'')+' onclick="nextMonth()">Complete '+monthName(state.month)+' →</button></div>'+managementPanel()+visualOverview()+networkMap()+'<div class="panel"><h2>Profitability by site</h2><p class="muted">Latest monthly operating profit, before company loan interest.</p>'+sites.map(s=>'<div class="row"><span>'+esc(s.name||regionOf(s.region).name)+'</span><b class="'+(s.last&&s.last.profit<0?'bad':'')+'">'+(s.last?money(s.last.profit):'Not yet trading')+'</b></div>').join('')+'</div><div class="panel"><h2>Your UK warehouse network</h2><p class="muted">Each tile shows pallet-location occupancy. Gold is occupied, grey is empty; robot icons show automation independently. Open new regions when your existing business can fund them.</p><div class="sitegrid">'+sites.map(miniSite).join('')+'</div></div><div class="panel"><h2>Monthly overview</h2><div class="row"><span>Operating territories</span><b>'+new Set(sites.map(s=>s.region)).size+'</b></div><div class="row"><span>Contracted spaces</span><b>'+num(total(c,occupancy))+' / '+num(total(c,siteSpace))+'</b></div><div class="row"><span>Forecast pallet moves / month</span><b>'+num(total(c,forecast))+'</b></div><div class="row"><span>Pallet moves capacity / month</span><b>'+num(total(c,siteCapacity))+'</b></div><div class="row"><span>Fixed monthly costs</span><b>'+fmt(total(c,s=>siteOverhead(s)+s.staff*C.staff*(s.region==='south'?1.75:1)+(s.hs?C.hs:0))+c.debt*C.interest)+'</b></div><p class="muted">Each site needs enough staff and capacity for its own contracts. Excess capacity in another territory does not cover local shortfalls.</p></div>'+(state.log.length?'<div class="panel"><h2>Market news</h2>'+state.log.slice(0,8).map(x=>'<p class="muted">'+esc(x)+'</p>').join('')+'</div>':'');}
function market(){return '<div class="panel"><h2>UK customer tenders</h2><p class="muted">Markets grow with established operators. Entering new territories gives access to local tenders, but efficient incumbents can underbid you.</p><button class="btn full" onclick="bidAll()">Bid for all eligible tenders at standard rates</button><div class="row"><label>Standard storage £ <input type="number" min="0" step="0.1" value="'+standardRate('storage')+'" onchange="setRate(\'storage\',this.value)"></label><label>Standard handling £ <input type="number" min="0" step="0.1" value="'+standardRate('handling')+'" onchange="setRate(\'handling\',this.value)"></label></div><p class="muted">Blank tender rates use these defaults automatically.</p></div>'+state.tenders.map(t=>{let b=state.bids[t.id],eligible=!!availableSite(state.player,t);return '<div class="contract"><h3>'+esc(t.name)+'</h3><p><span class="tag">'+esc(regionOf(t.region).name)+'</span> <span class="tag">'+t.term+' months</span></p><p>'+num(t.spaces)+' pallet spaces · '+num(t.moves)+' movements/month</p><p class="muted">Market-rate revenue '+fmt(t.spaces*C.storage+t.moves*C.handling)+'/month. Winning depends on price, reputation and local capacity.</p>'+(b?'<div class="notice">Your bid: £'+b.storage+' storage / £'+b.handling+' handling</div><button class="btn secondary" onclick="removeBid(\''+t.id+'\')">Withdraw bid</button>':'<div class="row"><label>Storage £ <input id="s-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" placeholder="Standard"></label><label>Handling £ <input id="h-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" placeholder="Standard"></label></div><button class="btn" '+(!eligible?'disabled':'')+' onclick="placeBid(\''+t.id+'\')">'+(eligible?'Submit bid':'No suitable local space')+'</button>')+'</div>';}).join('');}
function warehouse(){let c=state.player;let choices=regions.map(r=>'<button class="'+(selected===r.id?'active':'')+'" onclick="pickRegion(\''+r.id+'\')">'+esc(r.name)+'</button>').join('');let sites=owned(c,selected);let s=selectedSite();if(s&&!sites.includes(s))s=sites[0];return '<div class="panel"><h2>UK territories</h2><div class="tabs">'+choices+'</div><p class="muted">'+esc(regionOf(selected).desc)+'</p>'+(sites.length?'<p>'+sites.length+' operating site(s)</p>': '<p>No warehouse in this territory.</p><button class="btn" '+(c.cash<regionOf(selected).cost?'disabled':'')+' onclick="openRegion(\''+selected+'\')">Open 25,000 sq ft site · '+fmt(regionOf(selected).cost)+'</button><p class="muted">New sites have no contracts and incur '+fmt(regionOf(selected).overhead)+'/month overhead immediately. Local incumbents are well established.</p>')+'</div>'+(sites.length?'<div class="panel"><h2>Choose warehouse</h2><div class="tabs">'+sites.map((x,i)=>'<button class="'+(s===x?'active':'')+'" onclick="pickSite(\''+x.id+'\')">Site '+(i+1)+'</button>').join('')+'</div>'+miniSite(s)+'<div class="row"><span>Site name</span><button class="btn secondary" onclick="renameSite()">Rename site</button></div><div class="row"><span>Capacity</span><b>'+num(siteSpace(s))+' pallets</b></div><div class="row"><span>Committed occupancy</span><b>'+num(occupancy(s))+'</b></div><div class="row"><span>Pallet moves capacity / month</span><b>'+num(siteCapacity(s))+'/month</b></div><div class="row"><span>Forecast pallet moves / month</span><b>'+num(forecast(s))+'/month</b></div><div class="row"><span>People employed</span><b>'+s.staff+'</b></div>'+capacityGauge(s)+'<div class="row"><span>Monthly overhead</span><b>'+fmt(siteOverhead(s))+'</b></div></div><div class="panel"><h2>Workforce and safety</h2><p class="muted">Each employee costs £2,500/month and handles '+num(siteProductivity(s))+' pallet moves/month. An H&S manager costs £4,000/month and cuts incident risk from 40% to 10%.</p><div class="row"><b>'+s.staff+' staff</b><div class="stepper"><button onclick="staff(-1)">−</button><b>'+s.staff+'</b><button onclick="staff(1)">+</button></div></div><div class="row"><span>H&S manager: '+(s.hs?'Employed':'None')+'</span><button class="btn secondary" onclick="hs()">'+(s.hs?'Release':'Employ')+'</button></div></div><div class="panel"><h2>Warehouse investment</h2><p class="muted">Racking adds 250 spaces for £15,000 (one month). Expanding adds 25,000 sq ft for £100,000 (two months), with lower overhead per sq ft for each new section.</p><div class="row"><button class="btn" '+(s.racks+s.projects.filter(p=>p.type==='Racking').length>=s.sections*9||c.cash<C.rack?'disabled':'')+' onclick="buyRack()">Racking · £15k</button><button class="btn" '+(c.cash<C.expand||s.projects.some(p=>p.type==='Expansion')?'disabled':'')+' onclick="expand()">Expand · £100k</button></div><p class="muted">Automation costs £250,000 per section, takes three months and increases capacity and local labour productivity by 50% per automated section.</p><button class="btn" '+(c.cash<C.auto||s.automated+s.projects.filter(p=>p.type==='Automation').length>=s.sections?'disabled':'')+' onclick="automate()">Automate section · £250k</button><p class="muted">CI takes three months, improves labour productivity by a random 1–8% permanently and can start once every 12 months. Cost is based on forecast labour savings.</p><button class="btn secondary" '+(c.cash<ciCost(s)||state.month-s.ciStart<12?'disabled':'')+' onclick="startCI()">Start CI · '+fmt(ciCost(s))+'</button><p class="muted">Review investment impacts before committing cash.</p><div class="row"><button class="btn secondary" onclick="investmentForecast(&quot;Expansion&quot;)">Appraise expansion</button><button class="btn secondary" onclick="investmentForecast(&quot;Automation&quot;)">Appraise automation</button></div></div><div class="panel"><h2>Projects in progress</h2>'+(s.projects.length?s.projects.map((p,i)=>'<div class="row"><span>'+p.type+' · '+p.remaining+' month(s) remaining</span><button class="btn danger" onclick="cancelProject('+i+')">Cancel</button></div>').join(''):'<p class="muted">No projects underway.</p>')+'</div>':'')+'<div class="panel"><h2>Bank</h2><p>Cash '+cash(c)+' · Loan '+fmt(c.debt)+'</p><p class="muted">Loan limit £100,000. 36% annual interest (3% monthly) plus automatic capital repayment over 36 months. Both are paid monthly. Bankruptcy below −£25,000 cash.</p><div class="row"><button class="btn secondary" onclick="borrow()" '+(c.debt>=C.loan?'disabled':'')+'>Borrow £25k</button><button class="btn secondary" onclick="repay()" '+(c.debt<=0||c.cash<=0?'disabled':'')+'>Repay £25k</button></div></div>';}
function rivalsView(){let firms=all();let rows=[['Warehouse sq ft',c=>num(total(c,s=>s.sections*25000))],['Pallet spaces',c=>num(total(c,siteSpace))],['Occupied',c=>num(total(c,occupancy))],['Contracts',c=>num(total(c,s=>committed(s).length))],['Employees',c=>num(total(c,s=>s.staff))],['Monthly profit',c=>c.last?money(c.last.profit):'—'],['Cash',c=>cash(c)],['Reputation',c=>face(c.rep)],['Status',c=>c.bankrupt?'Bankrupt':'Trading']];return '<div class="panel"><h2>UK operator comparison</h2><p class="muted">Scroll sideways to compare your business against all four rivals. Rivals invest against demand, cash reserves and profitability targets.</p><div class="table-scroll"><table class="comparison-table"><tr><th>Measure</th>'+firms.map(c=>'<th class="'+(c===state.player?'you':'')+'">'+esc(c.name)+'</th>').join('')+'</tr>'+rows.map(([label,fn])=>'<tr><th>'+label+'</th>'+firms.map(c=>'<td class="'+(c===state.player?'you':'')+'">'+fn(c)+'</td>').join('')+'</tr>').join('')+'</table></div></div>'+state.rivals.map(c=>'<div class="panel"><h2>'+esc(c.name)+' '+face(c.rep)+'</h2><p class="muted">'+(c.bankrupt?'No longer trading.':'Strategy: '+esc(c.ai?.name||'Balanced operator')+' · Rolling profit '+money(rolling(c).profit)+' · Margin '+(rolling(c).margin*100).toFixed(1)+'% · Last investment: '+(c.lastInvestment?monthName(c.lastInvestment):'Not recorded'))+'</p><div class="sitegrid">'+c.sites.map(miniSite).join('')+'</div><p>Estimated value: '+fmt(valuation(c))+' · Your stake: '+shares(c)+'%</p>'+(c.bankrupt?'<p class="bad">No longer trading</p>':'<button class="btn secondary" '+(shares(c)>=100?'disabled':'')+' onclick="buyShares(\''+c.name+'\')">Buy 10% shares · '+fmt(Math.ceil(valuation(c)*.1*(shares(c)>=50?1.15:1)/1000)*1000)+'</button><p class="muted">Minority holdings can earn annual dividends. Above 50% gives control; at 100%, the business merges into yours, including its liabilities.</p>')+'</div>').join('')+(state.bankruptOffers.length?'<div class="panel"><h2>Distressed asset opportunities</h2>'+state.bankruptOffers.map((o,i)=>'<div class="contract"><h3>'+esc(o.name)+'</h3><p>Warehouse assets only. No contracts or debt transferred.</p><button class="btn" onclick="buyAssets('+i+')">Acquire assets · '+fmt(o.price)+'</button></div>').join('')+'</div>':'');}
function renameSite(){let s=selectedSite();if(!s)return;let n=prompt('Name this warehouse site:',s.name||regionOf(s.region).name+' DC');if(n===null)return;n=n.trim().slice(0,45);if(!n)return alert('Please enter a site name.');s.name=n;save();render();}
function renameBusiness(){let n=prompt('Business name:',state.player.name);if(n===null)return;n=n.trim().slice(0,45);if(!n)return alert('Please enter a business name.');state.player.name=n;save();render();}
function showSetup(){dialog('<h2>Start your logistics business</h2><p>Choose your company name and first warehouse name.</p><label>Business name</label><input id="newBusiness" maxlength="45" placeholder="Your logistics company" value="'+esc(state.player.name)+'"><label>First warehouse</label><input id="newSite" maxlength="45" placeholder="Midlands Distribution Centre" value="Midlands DC"><h3>How to play</h3><p>1. Check your warehouse space, staff and monthly pallet moves capacity.</p><p>2. Set tender prices and bid for contracts. Each contract uses pallet spaces and pallet moves.</p><p>3. Hire staff, add racking or expand carefully. Costs start before new revenue arrives.</p><p>4. Complete each month to see contract wins, profit, competitor activity and events.</p><h3>Your objectives</h3><p>Build a profitable UK warehouse network, win tenders, manage cash, grow company value and avoid bankruptcy. The South East is deliberately very difficult.</p><p class="muted">Loans charge 36% annual interest, with monthly capital repayments. Keep enough cash for both.</p><div class="modal-actions"><button class="btn" onclick="startConfiguredGame()">Start playing</button></div>');}
function startConfiguredGame(){let a=document.getElementById('newBusiness').value.trim().slice(0,45),b=document.getElementById('newSite').value.trim().slice(0,45);if(!a||!b)return alert('Enter both names.');state.player.name=a;state.player.sites[0].name=b;state.setupDone=true;save();closeDialog();render();}

function history(){let c=state.player,r=c.last;return '<div class="panel"><h2>Monthly financial results</h2>'+(r?'<table>'+[['Storage revenue',r.storage],['Handling revenue',r.handling],['Warehouse overhead',-r.rent],['Labour',-r.labour],['H&S managers',-r.hs],['H&S incidents',-r.incidentCost],['Loan interest',-r.interest],['Loan capital repaid (cash, not profit)',-r.principal],['Profit / loss',r.profit]].map(([k,v])=>'<tr><td>'+k+'</td><td>'+money(v)+'</td></tr>').join('')+'</table><h3>Handling</h3><div class="comparison">'+[['Forecast pallet moves',r.forecast],['Actual pallet moves',r.demand],['Handled pallet moves',r.handled],['Pallet moves capacity',r.capacity]].map(([k,v])=>'<div><small>'+k+'</small><strong>'+num(v)+'</strong></div>').join('')+'</div><p class="muted">Missed '+num(r.missed)+' pallet moves.</p>'+incidentSummary(r):'<p class="muted">Complete your first month to see results.</p>')+'</div><div class="panel"><h2>Contract book</h2>'+(c.sites.some(s=>committed(s).length)?c.sites.map(s=>committed(s).map(k=>'<div class="contract"><h3>'+esc(k.name)+'</h3><p>'+regionOf(s.region).name+' · '+num(k.spaces)+' spaces · '+num(k.moves)+' moves/month</p><p><b>Storage £'+k.storage+'/pallet/month · Handling £'+k.handling+'/move</b></p><p class="muted">Ends '+monthName(k.end)+'</p></div>').join('')).join(''):'<p class="muted">No active contracts.</p>')+'</div><div class="panel"><h2>Game controls</h2><button class="btn secondary" onclick="renameBusiness()">Rename business</button> <button class="btn danger" onclick="confirmReset()">Start new game</button><p class="muted">Version 10 imports V9.1, V8 or V7 progress when available. Existing monthly results remain unchanged.</p></div>';}
function confirmReset(){dialog('<h2>Start again?</h2><p>This will replace your current V10 save and open the setup page.</p><div class="modal-actions"><button class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn danger" onclick="resetGame()">Reset</button></div>')};function resetGame(){state=fresh();state.settings={storage:C.storage,handling:C.handling};state.achievements=[];state.eventOffer=null;state.schemaVersion=10;state.milestones=[];selected='mid';selectedSiteId=null;tab='office';save();closeDialog();render();showSetup()};
function render(){header();document.getElementById('view').innerHTML=({office,market,warehouse,rivals:rivalsView,history})[tab]();}
state=load();repairBankruptRivals();save();render();if(!state.setupDone)showSetup();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
