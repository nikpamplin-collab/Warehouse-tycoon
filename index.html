<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Warehouse Tycoon"><title>Warehouse Tycoon</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2f5;background:#0b1723;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#14283a;padding:18px 16px 12px;position:sticky;top:0;z-index:2;border-bottom:1px solid #355067}header h1{font-size:21px;margin:0 0 4px}header small{color:#b5c8d6}main{max-width:780px;margin:auto;padding:14px 14px 100px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:13px}.metric,.panel{background:#182c3c;border:1px solid #2d4759;border-radius:13px;padding:14px}.metric label{display:block;color:#a9bfcd;font-size:12px}.metric strong{font-size:21px;display:block;margin-top:5px}.panel{margin:12px 0}.panel h2{font-size:18px;margin:0 0 12px}.panel h3{font-size:15px;margin:12px 0 8px}.muted{color:#adc1cf;font-size:13px}.btn{border:0;background:#4ac7a3;color:#09201d;border-radius:9px;padding:11px 14px;font-weight:750}.btn:disabled{opacity:.4}.btn.secondary{background:#29465a;color:#f0f6f9}.btn.danger{background:#a94747;color:white}.btn.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0}.stepper{display:flex;align-items:center;gap:13px}.stepper button{border:1px solid #517086;background:#29465a;color:white;border-radius:8px;width:37px;height:37px;font-size:23px}.stepper b{min-width:24px;text-align:center}.tabs{display:flex;overflow-x:auto;gap:7px;margin:10px 0 16px}.tabs button{background:#20384a;border:1px solid #365469;color:#c8d9e3;padding:10px 14px;border-radius:10px;white-space:nowrap}.tabs button.active{background:#4ac7a3;color:#082019;font-weight:700}.contract{padding:12px;border:1px solid #385368;border-radius:11px;margin:10px 0;background:#122536}.contract h3{margin:0 0 6px}.contract p{margin:5px 0}.contract input{width:85px;border-radius:7px;background:#e7f2f4;color:#10232e;border:0;padding:9px}.tag{display:inline-block;border-radius:99px;padding:3px 8px;background:#2d5062;color:#d9f5ee;font-size:12px}.good{color:#69e0b7}.bad{color:#ff9a90}.warning{color:#ffce77}.bar{height:15px;background:#304557;border-radius:8px;overflow:hidden}.bar>span{display:block;height:100%;background:#4ac7a3}.rack{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0}.rack span{height:21px;border-radius:3px;background:#31485a}.rack span.filled{background:#c99b53}.notice{background:#253d50;border-left:3px solid #4ac7a3;padding:10px 12px;border-radius:4px;margin:9px 0;font-size:13px}.list{padding-left:18px}.list li{margin:8px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid #385062;text-align:left}td:last-child,th:last-child{text-align:right}svg{width:100%;height:auto}footer{text-align:center;color:#91a8b7;font-size:12px;padding:16px}input[type=range]{width:100%;accent-color:#4ac7a3}.overlay{position:fixed;inset:0;background:#07111bcc;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}.modal{max-width:430px;background:#1b3445;padding:24px;border-radius:16px;border:1px solid #507083}.hidden{display:none!important}
</style></head><body><header><h1>🏭 Warehouse Tycoon</h1><small id="headline">Build a warehouse business from the ground up</small></header><main><div id="metrics" class="metrics"></div><nav id="tabs" class="tabs"></nav><section id="view"></section><footer>Version 2.0 · Free, offline-capable · Saved on this device</footer></main><div id="dialog" class="overlay hidden"></div><script>
'use strict';
const CONFIG={rent:25000,staffCost:2500,staffMoves:2500,hsCost:4000,rackCost:15000,rackSpaces:250,baseSpaces:250,maxSpaces:2500,storageRate:16,moveRate:5.5,overdraft:25000,loanMax:100000,interest:.10/12};
const fmt=n=>'£'+Math.round(Math.abs(n)).toLocaleString('en-GB');const num=n=>Math.round(n).toLocaleString('en-GB');const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rand=(a,b)=>a+Math.random()*(b-a);const pick=a=>a[Math.floor(Math.random()*a.length)];const faces=n=>n<=2?'😡':n<=4?'😠':n<=6?'😟':n<=8?'🙂':'😄';
const rivals=[{name:'The Strategist',style:'Disciplined bids and careful investment',price:1.02,prudence:.9,service:.9},{name:'The Operator',style:'Service first, steady growth',price:1.12,prudence:.8,service:1},{name:'The Challenger',style:'Low prices, fast expansion',price:.83,prudence:.45,service:.65},{name:'The Gambler',style:'Unpredictable pricing and investment',price:.88,prudence:.2,service:.35}];
let state,tab='office',messages=[];const key='warehouse_tycoon_v2';
function company(name,ai=null){return {name,ai,cash:250000,debt:0,staff:0,racks:0,rep:7,contracts:[],history:[],last:null,misses:0,hsManager:false,bankrupt:false};}
function fresh(){let s={month:1,player:company('Your Warehouse'),rivals:rivals.map(r=>company(r.name,r)),tenders:[],bids:{},log:[],finished:false,seasonSeed:Math.random()*1000};s.tenders=makeTenders(s);return s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}function load(){try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.player&&s.rivals&&s.tenders)return s;}catch(e){}return fresh();}
function makeTenders(s){const names=['Northstar Retail','Greenfield Foods','Beacon Homeware','Apex Packaging','Harbour Supplies','Pioneer Trade','Maple Interiors','Citywide Goods','Brightline Products','Oak & Co','Summit Wholesale','Meridian Distribution'];return Array.from({length:4},(_,i)=>{let occupancy=pick([150,200,250,300,350,400,450,500,600,700]);let intensity=pick([2.5,4,5.5,7,9,11,13,15]);let moves=Math.round(occupancy*intensity/100)*100;return {id:'m'+s.month+'-'+i,name:pick(names)+' · '+String(s.month)+String(i),spaces:occupancy,moves,term:pick([6,9,12]),segment:pick(['Retail','Food','Home','Industrial']),start:s.month+1};});}
function all(){return [state.player,...state.rivals]}function space(c){return CONFIG.baseSpaces+c.racks*CONFIG.rackSpaces}function contracted(c){return c.contracts.filter(k=>k.end>=state.month)}function forecast(c){const ks=contracted(c);return {spaces:ks.reduce((x,k)=>x+k.spaces,0),moves:ks.reduce((x,k)=>x+k.moves,0)};}
function monthName(m){return 'Month '+m}function balance(c){return c.cash>=0?fmt(c.cash):'−'+fmt(c.cash)}function pct(n){return Math.round(n*100)+'%'}
function bidChance(t,priceS,priceM,company){let base=CONFIG.storageRate*t.spaces+CONFIG.moveRate*t.moves;let quote=priceS*t.spaces+priceM*t.moves;let f=forecast(company);let spaceFit=space(company)-f.spaces>=t.spaces?1:0;return {quote,base,spaceFit};}
function aiPrepare(c){if(c.bankrupt)return;let f=forecast(c),target=f.spaces+(c.ai.prudence>.7?250:400);while(space(c)<target&&space(c)<CONFIG.maxSpaces&&c.cash>CONFIG.rackCost+CONFIG.rent*(c.ai.prudence>.7?3:1.5)){c.cash-=CONFIG.rackCost;c.racks++;}let desired=Math.ceil(f.moves*1.08/CONFIG.staffMoves);c.staff=clamp(desired+(c.ai.service>.9&&f.moves>0?1:0),0,16);c.hsManager=c.ai.service>.8||c.cash>180000&&c.ai.prudence>.7;if(c.cash<CONFIG.rent*1.5&&c.debt<CONFIG.loanMax){let amt=Math.min(50000,CONFIG.loanMax-c.debt);c.cash+=amt;c.debt+=amt;}}
function aiBid(c,t){if(c.bankrupt)return null;let f=forecast(c),capacity=space(c)-f.spaces;if(capacity<t.spaces){let n=Math.ceil((t.spaces-capacity)/CONFIG.rackSpaces);if(c.racks+n>9||c.cash-n*CONFIG.rackCost<CONFIG.rent*(c.ai.prudence>.7?2:1))return null;c.racks+=n;c.cash-=n*CONFIG.rackCost;}let p=c.ai.price*rand(c.ai.prudence>.7?.94:.82,c.ai.prudence>.7?1.08:1.2);if(c.cash<40000)p*=.92;return {company:c,storage:Math.round(CONFIG.storageRate*p*100)/100,handling:Math.round(CONFIG.moveRate*p*100)/100};}
function resolveTenders(){let notes=[];for(let t of state.tenders){let offers=[];let pb=state.bids[t.id];if(pb){let b=bidChance(t,pb.storage,pb.handling,state.player);if(b.spaceFit)offers.push({company:state.player,storage:pb.storage,handling:pb.handling});else notes.push('Your bid for '+t.name+' was ineligible: insufficient free pallet spaces.');}for(let c of state.rivals){let offer=aiBid(c,t);if(offer)offers.push(offer);}if(!offers.length){notes.push(t.name+': no suitable bids.');continue;}let scored=offers.map(o=>{let price=o.storage*t.spaces+o.handling*t.moves;let baseline=CONFIG.storageRate*t.spaces+CONFIG.moveRate*t.moves;let quality=o.company.rep*7;let noise=rand(-8,8);return {...o,score:quality-70*(price/Math.max(1,baseline))+noise,price};}).sort((a,b)=>b.score-a.score);let w=scored[0];w.company.contracts.push({...t,storage:w.storage,handling:w.handling,end:t.start+t.term-1});notes.push(t.name+': '+w.company.name+' won ('+fmt(w.price)+'/month forecast).'+(w.company===state.player?' Your bid succeeded!':''));}return notes;}
function runCompany(c,m){if(c.bankrupt)return null;let contracts=c.contracts.filter(k=>k.start<=m&&k.end>=m);let planned=contracts.reduce((a,k)=>a+k.spaces,0);let storageRevenue=0,handlingDemand=0,actualDemand=0;for(let k of contracts){let seasonal=.08*Math.sin((m+k.start*2)*Math.PI/6);let variation=clamp(seasonal+rand(-.09,.09),-.2,.2);let stored=Math.min(k.spaces*(1+variation),k.spaces);let moves=k.moves*(1+variation);storageRevenue+=stored*k.storage;handlingDemand+=moves*k.handling;actualDemand+=moves;}let capacity=c.staff*CONFIG.staffMoves;let handlingFactor=actualDemand?Math.min(1,capacity/actualDemand):1;let handlingRevenue=handlingDemand*handlingFactor;let missed=Math.round(actualDemand*(1-handlingFactor));let incident=null,incidentCost=0,disruption=0;let chance=c.hsManager?.10:.40;if(Math.random()<chance){let roll=Math.random();let severity=roll<.68?'Small':roll<.92?'Medium':'Large';let cost=severity==='Small'?pick([1000,1500,2500]):severity==='Medium'?pick([6000,9000,12000]):pick([20000,30000,45000]);let loss=severity==='Small'?.03:severity==='Medium'?.12:.30;disruption=Math.round(actualDemand*loss);let lostHandling=handlingRevenue*loss;handlingRevenue-=lostHandling;missed+=disruption;incidentCost=cost;incident={severity,cost,missed:disruption};}let labour=c.staff*CONFIG.staffCost;let hsCost=c.hsManager?CONFIG.hsCost:0;let interest=c.debt*CONFIG.interest;let revenue=storageRevenue+handlingRevenue;let profit=revenue-CONFIG.rent-labour-hsCost-interest-incidentCost;c.cash+=profit;let old=c.rep;if(missed>0){c.misses++;if(missed>actualDemand*.08||c.misses>=2)c.rep=clamp(c.rep-1,1,10);}else if(contracts.length){c.misses=0;if(m%3===0)c.rep=clamp(c.rep+1,1,10);}if(c.cash < -CONFIG.overdraft)c.bankrupt=true;let record={month:m,storage:Math.round(storageRevenue),handling:Math.round(handlingRevenue),rent:CONFIG.rent,labour,hsCost,incidentCost,incident,interest:Math.round(interest),profit:Math.round(profit),cash:Math.round(c.cash),stored:Math.round(planned),moves:Math.round(actualDemand),missed,rep:c.rep};c.last=record;c.history.push(record);return {record,repDelta:c.rep-old};}
function nextMonth(){if(state.finished)return;for(let c of state.rivals)aiPrepare(c);let results=resolveTenders();let month=state.month;let notes=[];for(let c of all()){let r=runCompany(c,month);if(c===state.player&&r){notes.push('Monthly '+(r.record.profit>=0?'profit ':'loss ')+(r.record.profit<0?'−':'')+fmt(r.record.profit)+'.');if(r.record.incident)notes.push(r.record.incident.severity+' H&S incident: '+fmt(r.record.incidentCost)+' direct cost, '+num(r.record.incident.missed)+' movements disrupted.');if(r.record.missed)notes.push('Service shortfall: '+num(r.record.missed)+' movements not handled. Reputation '+(r.repDelta<0?'fell.':'at risk.'));if(c.bankrupt){notes.push('Your business has exhausted its cash and £25,000 overdraft.');state.finished=true;}}}state.log=[...results,...notes,...state.log].slice(0,60);state.month++;state.tenders=makeTenders(state);state.bids={};save();tab='office';render();showReport(results,notes);}
function showReport(results,notes){let c=state.player,r=c.last;let html='<h2>Month '+r.month+' results</h2><p><b class="'+(r.profit>=0?'good':'bad')+'">'+(r.profit>=0?'Profit ':'Loss ')+(r.profit<0?'−':'')+fmt(r.profit)+'</b></p><p>Storage '+fmt(r.storage)+' · Handling '+fmt(r.handling)+'</p><p>Rent '+fmt(r.rent)+' · Staff '+fmt(r.labour)+' · H&S '+fmt(r.hsCost||0)+' · Incident '+fmt(r.incidentCost||0)+' · Interest '+fmt(r.interest)+'</p><p>'+(r.incident?'<b class="warning">'+r.incident.severity+' H&S incident this month</b></p><p>':'')+'Cash '+balance(c)+' · Reputation '+faces(c.rep)+'</p><h3>Marketplace outcomes</h3><ul class="list">'+results.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(state.finished?'<p class="bad"><b>Bankrupt. Game over.</b></p>':'')+'<button class="btn full" onclick="closeDialog()">Continue</button>';dialog(html);}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function dialog(html){document.getElementById('dialog').innerHTML='<div class="modal">'+html+'</div>';document.getElementById('dialog').classList.remove('hidden');}function closeDialog(){document.getElementById('dialog').classList.add('hidden')}
function toggleHS(){state.player.hsManager=!state.player.hsManager;save();render()}function changeStaff(n){state.player.staff=clamp(state.player.staff+n,0,30);save();render()}function buyRack(){let c=state.player;if(c.racks>=9||c.cash<CONFIG.rackCost)return;c.cash-=CONFIG.rackCost;c.racks++;save();render()}function borrow(){let c=state.player,amt=Math.min(25000,CONFIG.loanMax-c.debt);if(amt<=0)return;c.cash+=amt;c.debt+=amt;save();render()}function repay(){let c=state.player,amt=Math.min(25000,c.debt,Math.max(0,c.cash));if(amt<=0)return;c.cash-=amt;c.debt-=amt;save();render()}
function placeBid(id){let t=state.tenders.find(t=>t.id===id),s=Number(document.getElementById('s-'+id).value),h=Number(document.getElementById('h-'+id).value);if(!t||!Number.isFinite(s)||!Number.isFinite(h)||s<0||h<0)return alert('Enter valid rates of zero or more.');let f=forecast(state.player);if(space(state.player)-f.spaces<t.spaces)return alert('You need more free pallet spaces before bidding. Buy racking first.');state.bids[id]={storage:s,handling:h};save();render()}
function removeBid(id){delete state.bids[id];save();render()}
function header(){let c=state.player,ls=c.last;document.getElementById('headline').textContent='Month '+state.month+' · 25,000 sq ft · '+(state.finished?'Bankrupt':'Independent 3PL');document.getElementById('metrics').innerHTML='<div class="metric"><label>Cash balance</label><strong class="'+(c.cash<0?'bad':'')+'">'+balance(c)+'</strong></div><div class="metric"><label>Last month profit</label><strong class="'+(ls&&ls.profit<0?'bad':'')+'">'+(ls?(ls.profit<0?'−':'')+fmt(ls.profit):'—')+'</strong></div><div class="metric"><label>Pallet spaces</label><strong>'+num(space(c))+' / 2,500</strong></div><div class="metric"><label>Reputation</label><strong>'+faces(c.rep)+' <span style="font-size:13px;color:#adc1cf">'+(c.rep>=9?'Delighted':c.rep>=7?'Happy':c.rep>=5?'Mixed':c.rep>=3?'Concerned':'Angry')+'</span></strong></div>';let tabs=[['office','Office'],['market','Tenders'],['warehouse','Warehouse'],['rivals','Rivals'],['history','Finances']];document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');}
function go(t){tab=t;render()}
function office(){let c=state.player,f=forecast(c),active=contracted(c);return '<div class="panel"><h2>Managing Director’s desk</h2><p class="muted">Each turn is one month. Review contracts, choose staff and investment, submit bids, then run the month.</p><div class="row"><span>Active customer contracts</span><b>'+active.length+'</b></div><div class="row"><span>Forecast pallet occupancy</span><b>'+num(f.spaces)+' / '+num(space(c))+'</b></div><div class="row"><span>Forecast monthly movements</span><b>'+num(f.moves)+'</b></div><div class="row"><span>Handling capacity</span><b>'+num(c.staff*CONFIG.staffMoves)+'</b></div><div class="row"><span>Monthly fixed costs (incl. interest)</span><b>'+fmt(CONFIG.rent+c.staff*CONFIG.staffCost+(c.hsManager?CONFIG.hsCost:0)+c.debt*CONFIG.interest)+'</b></div><div class="notice">'+(f.moves>c.staff*CONFIG.staffMoves?'⚠ You may miss handling demand. Consider more staff.':active.length?'Your staff can cover forecast handling demand. Seasonal peaks may still create pressure.':'No active contracts yet. Bid for work to generate income.')+'</div></div><div class="panel"><h2>Workforce</h2><p class="muted">Each employee costs £2,500 per month and handles up to 2,500 pallet movements. Hiring and releasing staff is free.</p><div class="row"><b>'+c.staff+' employees</b><div class="stepper"><button onclick="changeStaff(-1)">−</button><b>'+c.staff+'</b><button onclick="changeStaff(1)">+</button></div></div></div><div class="panel"><h2>Health & safety</h2><p class="muted">Employ a manager for £4,000/month to reduce monthly incident risk from 40% to 10%. Incidents can cause direct costs and lost handling revenue.</p><div class="row"><b>'+(c.hsManager?'Manager employed':'No H&S manager')+'</b><button class="btn secondary" onclick="toggleHS()">'+(c.hsManager?'Release manager':'Employ manager')+'</button></div></div><div class="panel"><h2>Run your business</h2><p>'+Object.keys(state.bids).length+' of '+state.tenders.length+' tenders bid for this month.</p><button class="btn full" '+(state.finished?'disabled':'')+' onclick="nextMonth()">Complete Month '+state.month+' →</button></div>'+(state.log.length?'<div class="panel"><h2>Recent news</h2>'+state.log.slice(0,5).map(x=>'<p class="muted">'+esc(x)+'</p>').join('')+'</div>':'');}
function market(){let c=state.player,f=forecast(c);return '<div class="panel"><h2>Customer tender board</h2><p class="muted">Bid any nonnegative monthly rates for storage (£ per occupied pallet) and handling (£ per movement). Four rivals also bid. Lowest price does not always win: service reputation matters.</p><p>Free pallet capacity: <b>'+num(Math.max(0,space(c)-f.spaces))+'</b></p></div>'+state.tenders.map(t=>{let b=state.bids[t.id],eligible=space(c)-f.spaces>=t.spaces;return '<div class="contract"><h3>'+esc(t.name)+'</h3><p><span class="tag">'+t.segment+'</span> <span class="tag">'+t.term+'-month contract</span></p><p>'+num(t.spaces)+' average pallet spaces · '+num(t.moves)+' movements/month</p><p class="muted">Forecast volumes can vary by up to ±20%. Contract starts next month.</p>'+(b?'<div class="notice">Bid submitted: £'+b.storage+'/space and £'+b.handling+'/movement</div><button class="btn secondary" onclick="removeBid(\''+t.id+'\')">Withdraw bid</button>':'<div class="row"><label>Storage £ <input id="s-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" value="16"></label><label>Handling £ <input id="h-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" value="5.5"></label></div><p class="muted">At these rates: '+fmt(t.spaces*CONFIG.storageRate+t.moves*CONFIG.moveRate)+' forecast monthly revenue.</p><button class="btn" '+(!eligible?'disabled':'')+' onclick="placeBid(\''+t.id+'\')">'+(eligible?'Submit bid':'Not enough pallet spaces')+'</button>')+'</div>';}).join('')+'<div class="panel"><h2>How contracts are won</h2><p class="muted">All five businesses compete using price, reputation and capacity, with a modest random element. Competitors cannot see your bid before placing theirs.</p></div>';}
function warehouse(){let c=state.player,f=forecast(c);return '<div class="panel"><h2>Your first warehouse</h2><p class="muted">25,000 sq ft · Dusty but full of potential</p><div class="rack">'+Array.from({length:10},(_,i)=>'<span class="'+(i<=c.racks?'filled':'')+'"></span>').join('')+'</div><p class="muted">Each gold block represents 250 pallet spaces, including your initial floor-storage block.</p><div class="row"><span>Installed capacity</span><b>'+num(space(c))+' spaces</b></div><div class="bar"><span style="width:'+(space(c)/CONFIG.maxSpaces*100)+'%"></span></div><div class="row"><span>Contracted occupancy</span><b>'+num(f.spaces)+' spaces</b></div><div class="bar"><span style="width:'+Math.min(100,f.spaces/space(c)*100)+'%;background:#d6a45c"></span></div><p>One racking block: <b>250 pallet spaces · £15,000</b></p><button class="btn" '+(c.racks>=9||c.cash<CONFIG.rackCost?'disabled':'')+' onclick="buyRack()">Buy racking block</button><p class="muted">No ongoing racking maintenance. Maximum capacity: 2,500 pallet spaces.</p></div><div class="panel"><h2>Bank and borrowing</h2><div class="row"><span>Cash</span><b>'+balance(c)+'</b></div><div class="row"><span>Outstanding loan</span><b>'+fmt(c.debt)+'</b></div><div class="row"><span>Monthly interest</span><b>'+fmt(c.debt*CONFIG.interest)+'</b></div><p class="muted">£25,000 interest-free overdraft. Optional loan up to £100,000 at 10% annual interest. Borrow or repay in £25,000 steps.</p><div class="row"><button class="btn secondary" onclick="borrow()" '+(c.debt>=CONFIG.loanMax?'disabled':'')+'>Borrow £25k</button><button class="btn secondary" onclick="repay()" '+(c.debt<=0||c.cash<=0?'disabled':'')+'>Repay up to £25k</button></div></div>';}
function rivalsView(){return '<div class="panel"><h2>Competing 3PLs</h2><p class="muted">All businesses started with £250,000, 250 pallet spaces and the same rules. Rivals have different bidding and investment habits. Their precise finances and bids remain private.</p></div>'+state.rivals.map(c=>{let f=forecast(c);return '<div class="panel"><div class="row"><h2 style="margin:0">'+c.name+'</h2><span style="font-size:29px">'+faces(c.rep)+'</span></div><p class="muted">'+c.ai.style+'</p><div class="row"><span>Warehouse capacity</span><b>'+num(space(c))+' spaces</b></div><div class="row"><span>Contracts</span><b>'+contracted(c).length+'</b></div><div class="row"><span>Business health</span><b class="'+(c.bankrupt?'bad':'')+'">'+(c.bankrupt?'Bankrupt':c.cash<30000?'Under pressure':c.cash>300000?'Growing':'Trading')+'</b></div></div>';}).join('');}
function lineGraph(data){if(!data.length)return '<p class="muted">Complete a month to begin your profit and cash history.</p>';let vals=data.flatMap(d=>[d.cash,d.profit]),min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;let w=340,h=180,pad=24;let point=(d,i,key)=>{let x=pad+i*(w-2*pad)/Math.max(1,data.length-1),y=h-pad-(d[key]-min)/range*(h-2*pad);return x.toFixed(1)+','+y.toFixed(1)};return '<svg viewBox="0 0 340 180" role="img" aria-label="Cash and monthly profit over time"><line x1="24" x2="316" y1="156" y2="156" stroke="#536c7b"/><polyline fill="none" stroke="#4ac7a3" stroke-width="3" points="'+data.map((d,i)=>point(d,i,'cash')).join(' ')+'"/><polyline fill="none" stroke="#e6b16b" stroke-width="3" points="'+data.map((d,i)=>point(d,i,'profit')).join(' ')+'"/><text x="24" y="15" fill="#a9bfcd" font-size="10">Cash (green) · Profit (gold)</text><text x="24" y="173" fill="#a9bfcd" font-size="10">Month '+data[0].month+'</text><text x="275" y="173" fill="#a9bfcd" font-size="10">Month '+data[data.length-1].month+'</text></svg>';}
function history(){let c=state.player,r=c.last;return '<div class="panel"><h2>Financial performance</h2>'+lineGraph(c.history)+'</div>'+(r?'<div class="panel"><h2>Last month’s P&L</h2><table><tr><td>Storage revenue</td><td>'+fmt(r.storage)+'</td></tr><tr><td>Handling revenue</td><td>'+fmt(r.handling)+'</td></tr><tr><td>Warehouse overhead</td><td>−'+fmt(r.rent)+'</td></tr><tr><td>Labour</td><td>−'+fmt(r.labour)+'</td></tr><tr><td>H&S manager</td><td>−'+fmt(r.hsCost||0)+'</td></tr><tr><td>H&S incident</td><td>−'+fmt(r.incidentCost||0)+'</td></tr><tr><td>Loan interest</td><td>−'+fmt(r.interest)+'</td></tr><tr><th>Operating profit / loss</th><th class="'+(r.profit>=0?'good':'bad')+'">'+(r.profit<0?'−':'')+fmt(r.profit)+'</th></tr></table><p class="muted">'+num(r.missed)+' movements were missed or disrupted.</p></div>':'')+'<div class="panel"><h2>Contract book</h2>'+(c.contracts.length?'<table><tr><th>Customer</th><th>Ends</th><th>Spaces</th></tr>'+c.contracts.map(k=>'<tr><td>'+esc(k.name)+'</td><td>'+k.end+'</td><td>'+k.spaces+'</td></tr>').join('')+'</table>':'<p class="muted">No contracts won yet.</p>')+'</div><div class="panel"><h2>Game controls</h2><button class="btn danger" onclick="confirmReset()">Start a new game</button><p class="muted">Progress saves automatically in this browser. Clearing browser data will erase your game.</p></div>';}
function confirmReset(){dialog('<h2>Start again?</h2><p>This replaces your saved game. Your current progress cannot be recovered.</p><div class="row"><button class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn danger" onclick="resetGame()">Reset game</button></div>')}function resetGame(){state=fresh();tab='office';save();closeDialog();render()}
function render(){header();document.getElementById('view').innerHTML=({office,market,warehouse,rivals:rivalsView,history})[tab]();}
state=load();for(let c of [state.player,...state.rivals]){if(typeof c.hsManager!=='boolean')c.hsManager=false;}render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
