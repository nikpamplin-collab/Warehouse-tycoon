</style></head><body><header><h1>🏭 Warehouse Tycoon</h1><small id="headline">Building a UK logistics business</small></header><main><div id="metrics" class="metrics"></div><nav id="tabs" class="tabs"></nav><section id="view"></section><footer>Version 5.0 · UK territories · Saved on this device</footer></main><div id="dialog" class="overlay hidden"></div><script>'use strict';
const C={staff:2500,moves:2500,hs:4000,rack:15000,expand:100000,auto:250000,overdraft:25000,loan:100000,interest:.10/12,storage:16,handling:5.5};
const regions=[{id:'mid',name:'Midlands',cost:0,overhead:25000,market:1,desc:'Your home market. Balanced competition and manageable operating costs.'},{id:'north',name:'Northern England',cost:250000,overhead:30000,market:1.18,desc:'Established operators have efficient warehouses, strong customer ties and low bid prices.'},{id:'south',name:'South East',cost:350000,overhead:38000,market:1.35,desc:'High property costs, demanding customers and heavily automated incumbents.'}];
const profiles=[{name:'The Strategist',price:1.01,service:.9},{name:'The Operator',price:1.07,service:1},{name:'The Challenger',price:.85,service:.7},{name:'The Gambler',price:.88,service:.4}];
const fmt=n=>'£'+Math.round(Math.abs(n||0)).toLocaleString('en-GB'),num=n=>Math.round(n||0).toLocaleString('en-GB'),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],face=n=>n<=3?'😠':n<=5?'😟':n<=8?'🙂':'😄',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−':'')+fmt(n);const monthName=m=>new Date(2026,m-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'});const key='warehouse_tycoon_v5';const oldKey='warehouse_tycoon_v4';
let state,tab='office',selected='mid';
function site(region,established=false){return {id:region+'-'+Math.floor(Math.random()*1e9),region,sections:established?3:1,racks:established?22:0,automated:established?1:0,staff:established?10:0,hs:established,ci:established?1.13:1,ciStart:-100,projects:[],contracts:[],last:null};}
function firm(name,ai=null){return {name,ai,cash:250000,debt:0,rep:7,sites:[],history:[],last:null,bankrupt:false,shares:{},misses:0};}
function fresh(){let player=firm('Your Business');player.sites=[site('mid')];let competitors=profiles.map((p,i)=>{let c=firm(p.name,p);c.sites=[site('mid')];let r=i<2?'north':'south';let established=site(r,true);established.staff=11;established.contracts=[{id:'existing-'+i,region:r,name:'Established regional accounts',spaces:4600,moves:18000,storage:14,handling:5,term:36,start:1,end:36,segment:'Retail'}];c.sites.push(established);c.cash=1400000;c.rep=9;return c;});let s={month:1,player,rivals:competitors,tenders:[],bids:{},log:[],finished:false,events:[],bankruptOffers:[],seed:Math.random()};s.tenders=makeTenders(s);return s;}
function load(){try{let s=JSON.parse(localStorage.getItem(key)||localStorage.getItem(oldKey));if(s&&s.player&&Array.isArray(s.player.sites)&&s.rivals){s.settings ||= {storage:C.storage,handling:C.handling};s.achievements ||= [];s.eventOffer ||= null;return s;}}catch(e){}let s=fresh();s.settings={storage:C.storage,handling:C.handling};s.achievements=[];s.eventOffer=null;return s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function all(){return [state.player,...state.rivals]};function active(c){return !c.bankrupt};function regionOf(id){return regions.find(r=>r.id===id)||regions[0]};function siteSpace(s){return s.sections*250+s.racks*250+s.automated*1250};function siteProductivity(s){return C.moves*s.ci*(1+.5*s.automated/s.sections)};function siteCapacity(s){return Math.round(s.staff*siteProductivity(s))};function siteOverhead(s){let base=regionOf(s.region).overhead,sum=0;for(let i=0;i<s.sections;i++)sum+=base*Math.pow(.9,i);return sum};function contracts(s,m=state.month){return s.contracts.filter(k=>k.end>=m&&k.start<=m)};function committed(s,m=state.month){return s.contracts.filter(k=>k.end>=m)};function occupancy(s){return committed(s).reduce((a,k)=>a+k.spaces,0)};function forecast(s){return committed(s).reduce((a,k)=>a+k.moves,0)};function total(c,fn){return c.sites.reduce((a,s)=>a+fn(s),0)};function owned(c,r){return c.sites.filter(s=>s.region===r)};function cash(c){return money(c.cash)};
function makeTenders(g){let names=['Northstar Retail','Greenfield Foods','Beacon Homeware','Apex Packaging','Harbour Supplies','Pioneer Trade','Maple Interiors','Citywide Goods','Brightline Products','Oak & Co','Summit Wholesale','Meridian Distribution'];let out=[];for(let r of regions){let operators=[g.player,...g.rivals].filter(c=>!c.bankrupt&&owned(c,r.id).length);if(!operators.length)continue;let maxSite=Math.max(...operators.flatMap(c=>owned(c,r.id).map(siteSpace)));let growth=1+Math.min(5,(g.month-1)/30);let count=r.id==='mid'?5:4;for(let i=0;i<count;i++){let scale=pick([.16,.26,.38,.52,.72,1,1.35]);let spaces=Math.round(clamp((100+maxSite*scale*.45)*growth*.65,100,22000)/50)*50;let intensity=pick([2,3,4,5,7,9,12]);let moves=Math.round(spaces*intensity/100)*100;out.push({id:'t'+g.month+'-'+r.id+'-'+i,region:r.id,name:pick(names)+' · '+monthName(g.month)+' #'+(i+1),spaces,moves,term:pick([6,9,12]),start:g.month+1,segment:pick(['Retail','Food','Home','Industrial'])});}}return out;}
function availableSite(c,t){return owned(c,t.region).filter(s=>siteSpace(s)-occupancy(s)>=t.spaces).sort((a,b)=>siteSpace(a)-occupancy(a)-(siteSpace(b)-occupancy(b)))[0]};
function standardRate(k){return Number(state.settings?.[k]??C[k]);}function setRate(k,v){let n=Number(v);if(Number.isFinite(n)&&n>=0){state.settings ||= {};state.settings[k]=n;save();}}function bidAll(){for(let t of state.tenders){if(!state.bids[t.id]&&availableSite(state.player,t))state.bids[t.id]={storage:standardRate('storage'),handling:standardRate('handling')};}save();render();}
function placeBid(id){let t=state.tenders.find(x=>x.id===id);if(!t)return;let sv=document.getElementById('s-'+id).value.trim(),hv=document.getElementById('h-'+id).value.trim();let storage=sv===''?standardRate('storage'):Number(sv),handling=hv===''?standardRate('handling'):Number(hv);if(!Number.isFinite(storage)||!Number.isFinite(handling)||storage<0||handling<0)return alert('Rates must be zero or above.');if(!availableSite(state.player,t))return alert('No warehouse in this territory has sufficient free pallet capacity.');state.bids[id]={storage,handling};save();render();}
function removeBid(id){delete state.bids[id];save();render();}
function aiPrepare(c){if(c.bankrupt)return;for(let s of c.sites){let f=forecast(s);s.staff=Math.min(100,Math.ceil(f*1.06/siteProductivity(s)));s.hs=c.ai.service>.85||c.cash>250000;if(occupancy(s)>siteSpace(s)-350&&c.cash>siteOverhead(s)*2+C.rack&&s.racks<9*s.sections){s.racks++;c.cash-=C.rack;}if(c.cash>650000&&s.automated<s.sections&&Math.random()<.04){c.cash-=C.auto;s.automated++;}if(c.cash>250000&&state.month-s.ciStart>=12&&f>8000&&Math.random()<.04){c.cash-=ciCost(s);s.ci*=1+rand(.01,.08);s.ciStart=state.month;}}if(c.cash<50000&&c.debt<C.loan){let n=Math.min(50000,C.loan-c.debt);c.cash+=n;c.debt+=n;}}
function aiOffer(c,t){let s=availableSite(c,t);if(!s||c.bankrupt)return null;let hard=t.region==='mid'?1:(t.region==='north'?.78:.68);let factor=c.ai.price*hard*rand(.92,1.07);return {c,s,storage:Math.round(C.storage*factor*100)/100,handling:Math.round(C.handling*factor*100)/100};}
function resolveTenders(){let notes=[];for(let t of state.tenders){let offers=[];let b=state.bids[t.id],p=availableSite(state.player,t);if(b&&p)offers.push({c:state.player,s:p,...b});for(let c of state.rivals){let offer=aiOffer(c,t);if(offer)offers.push(offer);}if(!offers.length){notes.push(t.name+': no suitable bids.');continue;}let winner=offers.map(o=>{let baseline=C.storage*t.spaces+C.handling*t.moves,price=o.storage*t.spaces+o.handling*t.moves;return {...o,score:o.c.rep*7-70*price/Math.max(1,baseline)+rand(-7,7),price};}).sort((a,b)=>b.score-a.score)[0];winner.s.contracts.push({...t,storage:winner.storage,handling:winner.handling,end:t.start+t.term-1});notes.push(t.name+': '+winner.c.name+' won ('+fmt(winner.price)+'/month forecast).');}return notes;}
function runSite(c,s,m){let ks=contracts(s,m),storage=0,handlingPotential=0,demand=0,forecastMoves=ks.reduce((a,k)=>a+k.moves,0);for(let k of ks){let variation=clamp(.08*Math.sin((m+k.start)*Math.PI/6)+rand(-.1,.1),-.2,.2);let actual=k.moves*(1+variation);demand+=actual;handlingPotential+=actual*k.handling;storage+=Math.min(k.spaces*(1+variation),k.spaces)*k.storage;}let capacity=siteCapacity(s),handled=Math.min(capacity,demand),missed=Math.max(0,demand-handled),handling=handlingPotential*(demand?handled/demand:1),incident=null,incidentCost=0;if(Math.random()<(s.hs?.1:.4)){let severity=pick(['Small','Small','Small','Medium','Medium','Large']);incidentCost=severity==='Small'?pick([1000,1500,2500]):severity==='Medium'?pick([6000,9000,12000]):pick([20000,30000,45000]);let disruption=severity==='Small'?.03:severity==='Medium'?.12:.30;let lost=handled*disruption;handled-=lost;missed+=lost;handling*=1-disruption;incident={severity,cost:incidentCost,moves:Math.round(lost)};}let rent=siteOverhead(s),labour=s.staff*C.staff,hs=s.hs?C.hs:0,profit=storage+handling-rent-labour-hs-incidentCost;let result={storage,handling,rent,labour,hs,incidentCost,incident,profit,forecast:forecastMoves,demand,capacity,handled,missed,spaces:ks.reduce((a,k)=>a+k.spaces,0)};s.last=result;return result;}
function progress(c){let updates=[];for(let s of c.sites){let done={};for(let p of [...s.projects]){p.remaining--;if(p.remaining<=0){if(p.type==='Racking')s.racks++;if(p.type==='Expansion')s.sections++;if(p.type==='Automation')s.automated++;if(p.type==='CI'){let gain=rand(.01,.08);s.ci*=1+gain;updates.push(regionOf(s.region).name+': CI completed, productivity +'+(gain*100).toFixed(1)+'%.');}else done[p.type]=(done[p.type]||0)+1;s.projects.splice(s.projects.indexOf(p),1);}else updates.push(regionOf(s.region).name+': '+p.type+' '+p.remaining+' month'+(p.remaining===1?'':'s')+' remaining.');}for(let [k,v] of Object.entries(done))updates.push(regionOf(s.region).name+': '+v+' '+k.toLowerCase()+' installation'+(v===1?'':'s')+' completed.');}return updates;}
function companyMonth(c,m){if(c.bankrupt)return null;let results=c.sites.map(s=>runSite(c,s,m));let record={month:m,storage:0,handling:0,rent:0,labour:0,hs:0,incidentCost:0,forecast:0,demand:0,capacity:0,handled:0,missed:0,spaces:0,profit:0,interest:c.debt*C.interest};for(let r of results)for(let k of ['storage','handling','rent','labour','hs','incidentCost','forecast','demand','capacity','handled','missed','spaces','profit'])record[k]+=r[k];record.profit-=record.interest;c.cash+=record.profit;record.cash=c.cash;record.incidents=results.flatMap(r=>r.incident?[r.incident]:[]);if(record.missed>record.demand*.07&&record.demand>0)c.rep=clamp(c.rep-1,1,10);else if(record.demand&&record.missed===0&&m%3===0)c.rep=clamp(c.rep+1,1,10);if(c.cash< -C.overdraft)c.bankrupt=true;c.last=record;c.history.push(record);return record;}
function valuation(c){let assets=total(c,s=>s.sections*100000+s.racks*C.rack+s.automated*C.auto);let earnings=Math.max(0,(c.last?.profit||0)*12*1.5);return Math.max(50000,Math.round((assets*.65+c.cash-c.debt+earnings)/10000)*10000)};
function bankruptcy(c){state.events.push('MARKET SHOCK: '+c.name+' has gone bankrupt. Its contracts are returning to the market.');for(let s of c.sites){for(let k of contracts(s,state.month)){state.tenders.push({id:'distress-'+state.month+'-'+Math.floor(Math.random()*1e8),region:s.region,name:k.name+' · emergency retender',spaces:k.spaces,moves:k.moves,term:6,start:state.month+1,segment:k.segment});}s.contracts=[];}state.bankruptOffers.push({name:c.name,price:Math.max(25000,Math.round(valuation(c)*.35/5000)*5000),sites:c.sites.map(s=>({...s,contracts:[],projects:[]})),expires:state.month+3});}
function nextMonth(){if(state.finished)return;if(state.eventOffer)return alert('Choose an outcome for the current event first.');state.events=[];for(let c of state.rivals)aiPrepare(c);let results=resolveTenders(),m=state.month,progressNotes=[];let emergency=[];for(let c of all()){let was=c.bankrupt,record=companyMonth(c,m);if(c!==state.player&&record&&m%12===0){let payout=Math.max(0,record.profit*2);let stake=shares(c)/100;let dividend=Math.min(Math.max(0,c.cash),payout)*stake;c.cash-=dividend;state.player.cash+=dividend;if(dividend>0)state.log.unshift('Dividend from '+c.name+': '+fmt(dividend)+'.');}let updates=progress(c);if(c===state.player)progressNotes=updates;if(!was&&c.bankrupt){if(c===state.player)state.finished=true;else {bankruptcy(c);emergency.push(...state.tenders.filter(t=>t.id.startsWith('distress-')));}}}state.log=[...state.events,...progressNotes,...results,...state.log].slice(0,70);state.month++;state.tenders=[...makeTenders(state),...emergency];for(let offer of state.bankruptOffers){if(offer.expires>=state.month){for(let t of offer.sites){/* asset offers remain available until expiry */}}}state.bankruptOffers=state.bankruptOffers.filter(o=>o.expires>=state.month);state.bids={};gameplayTick();save();tab='office';render();report(results,progressNotes);}
function dialog(html){let d=document.getElementById('dialog');d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';d.classList.remove('hidden');}function closeDialog(){document.getElementById('dialog').classList.add('hidden');document.getElementById('dialog').innerHTML='';}
function report(results,progressNotes){let c=state.player,r=c.last;if(!r)return;let movement='<div class="panel"><h3>Handling performance</h3><div class="comparison">'+[['Forecast',r.forecast],['Actual demand',r.demand],['Handled',r.handled],['Capacity',r.capacity]].map(([n,v])=>'<div><small>'+n+'</small><strong>'+num(v)+'</strong></div>').join('')+'</div><p class="muted">'+num(r.missed)+' movements missed or disrupted.</p></div>';dialog('<h2>'+monthName(r.month)+' results</h2>'+state.events.map(x=>'<div class="alert">'+esc(x)+'</div>').join('')+'<p class="big '+(r.profit>=0?'good':'bad')+'">'+(r.profit>=0?'Profit ':'Loss ')+money(r.profit)+'</p><p>Revenue '+fmt(r.storage+r.handling)+' · Costs '+fmt(r.rent+r.labour+r.hs+r.incidentCost+r.interest)+'</p><p>Cash '+cash(c)+' · Reputation '+face(c.rep)+'</p>'+movement+'<h3>Investment progress</h3>'+(progressNotes.length?'<ul class="list">'+progressNotes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">No active projects.</p>')+'<h3>Marketplace</h3><ul class="list">'+results.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(state.finished?'<p class="bad">Your business is bankrupt.</p>':'')+'<div class="modal-actions"><button class="btn full" onclick="closeDialog()">Continue</button></div>');}
function cancelProject(index){let s=selectedSite(),p=s?.projects[index];if(!p)return;let costs={Racking:C.rack,Expansion:C.expand,Automation:C.auto,CI:ciCost(s)};let refund=Math.round((p.cost??costs[p.type]??0)*.75);if(!confirm('Cancel '+p.type+'? You will recover '+fmt(refund)+' (75% of project cost).'))return;state.player.cash+=refund;s.projects.splice(index,1);if(p.type==='CI')s.ciStart=state.month-12;state.log.unshift('Cancelled '+p.type+' project at '+regionOf(s.region).name+'.');save();render();}function project(type,cost,months){let s=selectedSite();if(!s||state.player.cash<cost)return alert('Not enough cash.');state.player.cash-=cost;s.projects.push({type,remaining:months,cost});if(type==='CI')s.ciStart=state.month;save();render();}
function selectedSite(){return state.player.sites.find(s=>s.id===selectedSiteId)||owned(state.player,selected)[0]};let selectedSiteId=null;
function pickSite(id){selectedSiteId=id;render()};function pickRegion(id){selected=id;selectedSiteId=null;render()};
function buyRack(){let s=selectedSite();if(s.racks+s.projects.filter(p=>p.type==='Racking').length>=s.sections*9)return alert('No more racking slots. Expand this site.');project('Racking',C.rack,1)};
function expand(){let s=selectedSite();if(s.projects.some(p=>p.type==='Expansion'))return alert('Expansion already underway.');project('Expansion',C.expand,2)};
function automate(){let s=selectedSite();if(s.automated+s.projects.filter(p=>p.type==='Automation').length>=s.sections)return alert('All sections automated or underway.');project('Automation',C.auto,3)};
function ciCost(s){let f=forecast(s),needed=Math.ceil(f/Math.max(1,siteProductivity(s)));return Math.max(5000,Math.round(needed*C.staff*(.045/1.045)*12/500)*500)};
function startCI(){let s=selectedSite();if(state.month-s.ciStart<12||s.projects.some(p=>p.type==='CI'))return alert('CI is available once every 12 months.');project('CI',ciCost(s),3)};
function staff(n){let s=selectedSite();s.staff=clamp(s.staff+n,0,150);save();render()};function hs(){let s=selectedSite();s.hs=!s.hs;save();render()};function borrow(){let c=state.player,n=Math.min(25000,C.loan-c.debt);if(n>0){c.debt+=n;c.cash+=n;save();render()}};function repay(){let c=state.player,n=Math.min(25000,c.debt,Math.max(0,c.cash));if(n>0){c.debt-=n;c.cash-=n;save();render()}};
function openRegion(id){let r=regionOf(id),c=state.player;if(owned(c,id).length)return alert('You already operate in this territory.');if(c.cash<r.cost)return alert('You need '+fmt(r.cost)+' cash to open a site.');c.cash-=r.cost;c.sites.push(site(id));selected=id;selectedSiteId=null;save();render();}
function shares(c){return state.player.shares[c.name]||0};function buyShares(name){let c=state.rivals.find(x=>x.name===name);if(!c||c.bankrupt)return;let current=shares(c);if(current>=100)return;let percent=10,price=Math.ceil(valuation(c)*percent/100*(current>=50?1.15:1)/1000)*1000;if(state.player.cash<price)return alert('Insufficient cash for '+fmt(price)+' share purchase.');state.player.cash-=price;state.player.shares[c.name]=current+percent;if(current+percent===60){state.log.unshift('CONTROL: You now hold a controlling interest in '+c.name+'.');}if(current+percent===60){state.log.unshift('CONTROL: You now hold a controlling interest in '+c.name+'.');}if(current+percent===100){state.player.sites.push(...c.sites.map(s=>JSON.parse(JSON.stringify(s))));state.player.cash+=c.cash-c.debt;c.cash=0;c.debt=0;c.sites=[];c.bankrupt=true;state.events=['TAKEOVER COMPLETE: '+c.name+' has merged into your business. Warehouses, contracts and liabilities transferred.'];state.log.unshift(state.events[0]);}save();render();}
function buyAssets(i){let o=state.bankruptOffers[i];if(!o||state.player.cash<o.price)return alert('Not enough cash for these assets.');state.player.cash-=o.price;state.player.sites.push(...o.sites.map(s=>JSON.parse(JSON.stringify(s))));state.bankruptOffers.splice(i,1);state.log.unshift('ACQUISITION: Purchased '+o.name+' warehouse assets for '+fmt(o.price)+'. Contracts not included.');save();render();}
function capacityGauge(s){let pct=siteCapacity(s)?Math.round(forecast(s)/siteCapacity(s)*100):forecast(s)?150:0;let colour=pct>100?'#ff7777':pct>80?'#f2b65d':'#4ac7a3';return '<div class="capacity-note"><small>Handling load '+pct+'% · '+num(Math.max(0,siteCapacity(s)-forecast(s)))+' spare movements/month</small>'+meter(Math.min(pct,100),colour)+'</div>';}
function warehouseGraphic(s){let n=Math.min(6,Math.max(2,s.sections+2));return '<div class="warehouse-art"><div class="art-sky"></div><div class="art-building"><div class="art-roof"></div><div class="art-name">'+esc(regionOf(s.region).name)+' DC</div><div class="art-docks">'+Array.from({length:n},()=>'<span class="dock"></span>').join('')+'</div></div><div class="art-yard"><span>🚚</span><span>📦</span><span>🚛</span></div></div>';}
function trendChart(){let h=state.player.history.slice(-9),values=h.map(r=>r.storage+r.handling),profits=h.map(r=>r.profit);if(!h.length)return '<p class="muted">Complete a month to see your revenue and profit trends.</p>';let max=Math.max(1,...values,...profits),min=Math.min(0,...profits),span=max-min||1;let line=arr=>arr.map((v,i)=>(24+i*(352/Math.max(1,arr.length-1))).toFixed(1)+','+(138-(v-min)/span*110).toFixed(1)).join(' ');return '<svg viewBox="0 0 400 165" role="img" aria-label="Revenue and profit trend"><line x1="20" y1="140" x2="384" y2="140" stroke="#57718b"/><polyline fill="none" stroke="#64c7ff" stroke-width="4" stroke-linejoin="round" points="'+line(values)+'"/><polyline fill="none" stroke="#4fe0aa" stroke-width="4" stroke-linejoin="round" points="'+line(profits)+'"/></svg><div class="chart-legend"><span>● Revenue</span><span>● Profit</span></div>';}
function visualOverview(){let c=state.player,s=c.sites.find(x=>x.id===selectedSiteId)||c.sites[0];return '<div class="visual-grid"><div class="panel visual-hero"><h2>🏭 Your warehouse network</h2>'+warehouseGraphic(s)+'<div class="row"><b>'+esc(regionOf(s.region).name)+' · '+num(siteSpace(s))+' pallet spaces</b><button class="btn secondary" onclick="go(\'warehouse\')">Manage warehouse</button></div>'+capacityGauge(s)+'</div><div class="panel"><h2>📈 Business performance</h2><div class="visual-stats"><div><small>Revenue this month</small><strong>'+fmt((c.last?.storage||0)+(c.last?.handling||0))+'</strong></div><div><small>Profit this month</small><strong>'+money(c.last?.profit||0)+'</strong></div><div><small>Company value</small><strong>'+fmt(valuation(c))+'</strong></div></div>'+trendChart()+'</div></div><div class="panel"><h2>🗺️ Territory snapshot</h2><div class="territory-cards">'+regions.map(r=>{let sites=owned(c,r.id),f=sites.reduce((a,x)=>a+forecast(x),0),cap=sites.reduce((a,x)=>a+siteCapacity(x),0),pct=cap?Math.round(100*f/cap):0;return '<button class="territory-card" onclick="selected=\''+r.id+'\';go(\'warehouse\')"><b>'+esc(r.name)+'</b><span>'+sites.length+' site(s)</span><small>'+(sites.length?num(f)+' / '+num(cap)+' movements':'Not yet open')+'</small>'+(sites.length?meter(pct,pct>100?'#ff7777':pct>80?'#f2b65d':'#4ac7a3'):'')+'</button>';}).join('')+'</div></div><div class="panel"><h2>🎮 What’s happening</h2>'+((state.eventOffer)?'<div class="notice"><b>Decision needed:</b> '+esc(state.eventOffer.title)+'<p>'+esc(state.eventOffer.description)+'</p><button class="btn" onclick="showEvent()">Choose response</button></div>':'')+'<p class="muted">'+esc(state.latestCompetitor||'Competitors are bidding for business across the UK.')+'</p><p class="muted">'+esc(state.latestAchievement||'Grow your business to unlock milestones.')+'</p></div>';}
function gameplayTick(){let c=state.player,m=state.month;state.achievements ||= [];let milestones=[['first-win',c.sites.some(s=>s.contracts.length),'Milestone: First customer contract won!'],['million',c.history.some(r=>r.storage+r.handling>=1000000),'Milestone: £1m monthly revenue reached!'],['three-sites',c.sites.length>=3,'Milestone: Three warehouses operating!'],['profit',c.history.some(r=>r.profit>=100000),'Milestone: £100k monthly profit reached!']];for(let [id,yes,message] of milestones)if(yes&&!state.achievements.includes(id)){state.achievements.push(id);state.latestAchievement=message;state.log.unshift(message);}if(m%3===0){let rival=pick(state.rivals.filter(x=>!x.bankrupt));if(rival){state.latestCompetitor='Competitor update: '+rival.name+' is active in '+regionOf(pick(rival.sites).region).name+'.';state.log.unshift(state.latestCompetitor);}}if(m%4===0&&!state.eventOffer&&!c.bankrupt){state.eventOffer={title:'Unexpected customer request',description:'A customer offers a one-off urgent job. Do you take the extra work?',choices:['Accept extra work','Quote a premium','Decline the request']};}}
function showEvent(){let e=state.eventOffer;if(!e)return;dialog('<h2>Unexpected event</h2><p>'+esc(e.description)+'</p>'+e.choices.map((v,i)=>'<button class="btn full '+(i?'secondary':'')+'" style="margin:6px 0" onclick="resolveEvent('+i+')">'+esc(v)+'</button>').join('')+'<div class="modal-actions"><button class="btn secondary" onclick="closeDialog()">Decide later</button></div>');}
function resolveEvent(choice){if(!state.eventOffer)return;let c=state.player,notes=['You accepted the job: £12,000 earned, but paid £5,000 in extra labour.','You quoted a premium. The customer '+(Math.random()<.5?'accepted: £14,000 net earned.':'declined: no change.') ,'You declined the work and protected existing capacity.'];if(choice===0)c.cash+=7000;if(choice===1){let won=Math.random()<.5;if(won)c.cash+=14000;notes[1]=won?'Your premium quote was accepted: £14,000 net earned.':'Your premium quote was declined: no change.';}state.log.unshift('EVENT: '+notes[choice]);state.eventOffer=null;save();closeDialog();render();}
function header(){let c=state.player;document.getElementById('headline').textContent=monthName(state.month)+' · '+num(total(c,s=>s.sections*25000))+' sq ft · '+(state.finished?'Bankrupt':'UK logistics operator');document.getElementById('metrics').innerHTML=[['Cash',cash(c)],['Monthly profit',c.last?money(c.last.profit):'—'],['Pallet spaces',num(total(c,siteSpace))],['Reputation',face(c.rep)],['Estimated company value',fmt(valuation(c))]].map(([k,v])=>'<div class="metric"><label>'+k+'</label><strong>'+v+'</strong></div>').join('');let tabs=[['office','Office'],['market','Tenders'],['warehouse','Warehouses'],['rivals','Rivals'],['history','Finances']];document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');}
function go(k){tab=k;render()};function meter(value,color='#4ac7a3'){return '<div class="bar"><span style="width:'+clamp(value,0,100)+'%;background:'+color+'"></span></div>'};
function miniSite(s){let occ=siteSpace(s)?100*occupancy(s)/siteSpace(s):0,auto=100*s.automated/s.sections;return '<div class="mini-site"><div class="row"><b>'+esc(regionOf(s.region).name)+'</b><small>'+num(s.sections*25000)+' sq ft</small></div><div class="tilegrid">'+Array.from({length:20},(_,i)=>'<i class="'+(i<Math.round(occ/5)?'filled':'')+(i<Math.round(auto/5)?' automated':'')+'"></i>').join('')+'</div><div class="row"><small>Occupied '+Math.round(occ)+'%</small><small>Automated '+Math.round(auto)+'%</small></div></div>'};
function office(){let c=state.player,sites=c.sites;return visualOverview()+'<div class="panel"><h2>Your UK warehouse network</h2><p class="muted">Each tile represents warehouse space. Gold shows occupied space, blue shows automated sections. Open new regions when your existing business can fund them.</p><div class="sitegrid">'+sites.map(miniSite).join('')+'</div></div><div class="panel"><h2>Monthly overview</h2><div class="row"><span>Operating territories</span><b>'+new Set(sites.map(s=>s.region)).size+'</b></div><div class="row"><span>Contracted spaces</span><b>'+num(total(c,occupancy))+' / '+num(total(c,siteSpace))+'</b></div><div class="row"><span>Forecast movements</span><b>'+num(total(c,forecast))+'</b></div><div class="row"><span>Handling capacity</span><b>'+num(total(c,siteCapacity))+'</b></div><div class="row"><span>Fixed monthly costs</span><b>'+fmt(total(c,s=>siteOverhead(s)+s.staff*C.staff+(s.hs?C.hs:0))+c.debt*C.interest)+'</b></div><p class="muted">Each site needs enough staff and capacity for its own contracts. Excess capacity in another territory does not cover local shortfalls.</p></div><div class="panel"><h2>Run your business</h2><p>'+Object.keys(state.bids).length+' of '+state.tenders.length+' tenders bid for.</p><button class="btn full" '+(state.finished?'disabled':'')+' onclick="nextMonth()">Complete '+monthName(state.month)+' →</button></div>'+(state.log.length?'<div class="panel"><h2>Market news</h2>'+state.log.slice(0,8).map(x=>'<p class="muted">'+esc(x)+'</p>').join('')+'</div>':'');}
function market(){return '<div class="panel"><h2>UK customer tenders</h2><p class="muted">Markets grow with established operators. Entering new territories gives access to local tenders, but efficient incumbents can underbid you.</p><button class="btn full" onclick="bidAll()">Bid for all eligible tenders at standard rates</button><div class="row"><label>Standard storage £ <input type="number" min="0" step="0.1" value="'+standardRate('storage')+'" onchange="setRate(\'storage\',this.value)"></label><label>Standard handling £ <input type="number" min="0" step="0.1" value="'+standardRate('handling')+'" onchange="setRate(\'handling\',this.value)"></label></div><p class="muted">Blank tender rates use these defaults automatically.</p></div>'+state.tenders.map(t=>{let b=state.bids[t.id],eligible=!!availableSite(state.player,t);return '<div class="contract"><h3>'+esc(t.name)+'</h3><p><span class="tag">'+esc(regionOf(t.region).name)+'</span> <span class="tag">'+t.term+' months</span></p><p>'+num(t.spaces)+' pallet spaces · '+num(t.moves)+' movements/month</p><p class="muted">Market-rate revenue '+fmt(t.spaces*C.storage+t.moves*C.handling)+'/month. Winning depends on price, reputation and local capacity.</p>'+(b?'<div class="notice">Your bid: £'+b.storage+' storage / £'+b.handling+' handling</div><button class="btn secondary" onclick="removeBid(\''+t.id+'\')">Withdraw bid</button>':'<div class="row"><label>Storage £ <input id="s-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" placeholder="Standard"></label><label>Handling £ <input id="h-'+t.id+'" type="number" inputmode="decimal" min="0" step="any" placeholder="Standard"></label></div><button class="btn" '+(!eligible?'disabled':'')+' onclick="placeBid(\''+t.id+'\')">'+(eligible?'Submit bid':'No suitable local space')+'</button>')+'</div>';}).join('');}
function warehouse(){let c=state.player;let choices=regions.map(r=>'<button class="'+(selected===r.id?'active':'')+'" onclick="pickRegion(\''+r.id+'\')">'+esc(r.name)+'</button>').join('');let sites=owned(c,selected);let s=selectedSite();if(s&&!sites.includes(s))s=sites[0];return '<div class="panel"><h2>UK territories</h2><div class="tabs">'+choices+'</div><p class="muted">'+esc(regionOf(selected).desc)+'</p>'+(sites.length?'<p>'+sites.length+' operating site(s)</p>': '<p>No warehouse in this territory.</p><button class="btn" '+(c.cash<regionOf(selected).cost?'disabled':'')+' onclick="openRegion(\''+selected+'\')">Open 25,000 sq ft site · '+fmt(regionOf(selected).cost)+'</button><p class="muted">New sites have no contracts and incur '+fmt(regionOf(selected).overhead)+'/month overhead immediately. Local incumbents are well established.</p>')+'</div>'+(sites.length?'<div class="panel"><h2>Choose warehouse</h2><div class="tabs">'+sites.map((x,i)=>'<button class="'+(s===x?'active':'')+'" onclick="pickSite(\''+x.id+'\')">Site '+(i+1)+'</button>').join('')+'</div>'+miniSite(s)+'<div class="row"><span>Capacity</span><b>'+num(siteSpace(s))+' pallets</b></div><div class="row"><span>Committed occupancy</span><b>'+num(occupancy(s))+'</b></div><div class="row"><span>Handling capacity</span><b>'+num(siteCapacity(s))+'/month</b></div><div class="row"><span>Forecast volume</span><b>'+num(forecast(s))+'/month</b></div><div class="row"><span>People employed</span><b>'+s.staff+'</b></div>'+capacityGauge(s)+'<div class="row"><span>Monthly overhead</span><b>'+fmt(siteOverhead(s))+'</b></div></div><div class="panel"><h2>Workforce and safety</h2><p class="muted">Each employee costs £2,500/month and handles '+num(siteProductivity(s))+' movements. An H&S manager costs £4,000/month and cuts incident risk from 40% to 10%.</p><div class="row"><b>'+s.staff+' staff</b><div class="stepper"><button onclick="staff(-1)">−</button><b>'+s.staff+'</b><button onclick="staff(1)">+</button></div></div><div class="row"><span>H&S manager: '+(s.hs?'Employed':'None')+'</span><button class="btn secondary" onclick="hs()">'+(s.hs?'Release':'Employ')+'</button></div></div><div class="panel"><h2>Warehouse investment</h2><p class="muted">Racking adds 250 spaces for £15,000 (one month). Expanding adds 25,000 sq ft for £100,000 (two months), with lower overhead per sq ft for each new section.</p><div class="row"><button class="btn" '+(s.racks+s.projects.filter(p=>p.type==='Racking').length>=s.sections*9||c.cash<C.rack?'disabled':'')+' onclick="buyRack()">Racking · £15k</button><button class="btn secondary" '+(c.cash<C.expand||s.projects.some(p=>p.type==='Expansion')?'disabled':'')+' onclick="expand()">Expand · £100k</button></div><p class="muted">Automation costs £250,000 per section, takes three months and increases capacity and local labour productivity by 50% per automated section.</p><button class="btn" '+(c.cash<C.auto||s.automated+s.projects.filter(p=>p.type==='Automation').length>=s.sections?'disabled':'')+' onclick="automate()">Automate section · £250k</button><p class="muted">CI takes three months, improves labour productivity by a random 1–8% permanently and can start once every 12 months. Cost is based on forecast labour savings.</p><button class="btn secondary" '+(c.cash<ciCost(s)||state.month-s.ciStart<12?'disabled':'')+' onclick="startCI()">Start CI · '+fmt(ciCost(s))+'</button></div><div class="panel"><h2>Projects in progress</h2>'+(s.projects.length?s.projects.map((p,i)=>'<div class="row"><span>'+p.type+' · '+p.remaining+' month(s) remaining</span><button class="btn danger" onclick="cancelProject('+i+')">Cancel</button></div>').join(''):'<p class="muted">No projects underway.</p>')+'</div>':'')+'<div class="panel"><h2>Bank</h2><p>Cash '+cash(c)+' · Loan '+fmt(c.debt)+'</p><p class="muted">Loan limit £100,000, 10% annual interest. Bankruptcy below −£25,000 cash.</p><div class="row"><button class="btn secondary" onclick="borrow()" '+(c.debt>=C.loan?'disabled':'')+'>Borrow £25k</button><button class="btn secondary" onclick="repay()" '+(c.debt<=0||c.cash<=0?'disabled':'')+'>Repay £25k</button></div></div>';}
function rivalsView(){let firms=all();let rows=[['Warehouse sq ft',c=>num(total(c,s=>s.sections*25000))],['Pallet spaces',c=>num(total(c,siteSpace))],['Occupied',c=>num(total(c,occupancy))],['Contracts',c=>num(total(c,s=>committed(s).length))],['Employees',c=>num(total(c,s=>s.staff))],['Monthly profit',c=>c.last?money(c.last.profit):'—'],['Cash',c=>cash(c)],['Reputation',c=>face(c.rep)],['Status',c=>c.bankrupt?'Bankrupt':'Trading']];return '<div class="panel"><h2>UK operator comparison</h2><p class="muted">Scroll sideways to compare your business against all four rivals. Rivals operate under the same cash, staffing and investment rules.</p><div class="table-scroll"><table class="comparison-table"><tr><th>Measure</th>'+firms.map(c=>'<th class="'+(c===state.player?'you':'')+'">'+esc(c.name)+'</th>').join('')+'</tr>'+rows.map(([label,fn])=>'<tr><th>'+label+'</th>'+firms.map(c=>'<td class="'+(c===state.player?'you':'')+'">'+fn(c)+'</td>').join('')+'</tr>').join('')+'</table></div></div>'+state.rivals.map(c=>'<div class="panel"><h2>'+esc(c.name)+' '+face(c.rep)+'</h2><p class="muted">'+(c.bankrupt?'No longer trading.':c.ai.name==='The Strategist'?'Careful bids and measured investment.':'Competes for local contracts and grows its estate.')+'</p><div class="sitegrid">'+c.sites.map(miniSite).join('')+'</div><p>Estimated value: '+fmt(valuation(c))+' · Your stake: '+shares(c)+'%</p>'+(c.bankrupt?'<p class="bad">No longer trading</p>':'<button class="btn secondary" '+(shares(c)>=100?'disabled':'')+' onclick="buyShares(\''+c.name+'\')">Buy 10% shares · '+fmt(Math.ceil(valuation(c)*.1*(shares(c)>=50?1.15:1)/1000)*1000)+'</button><p class="muted">Minority holdings can earn annual dividends. Above 50% gives control; at 100%, the business merges into yours, including its liabilities.</p>')+'</div>').join('')+(state.bankruptOffers.length?'<div class="panel"><h2>Distressed asset opportunities</h2>'+state.bankruptOffers.map((o,i)=>'<div class="contract"><h3>'+esc(o.name)+'</h3><p>Warehouse assets only. No contracts or debt transferred.</p><button class="btn" onclick="buyAssets('+i+')">Acquire assets · '+fmt(o.price)+'</button></div>').join('')+'</div>':'');}
function history(){let c=state.player,r=c.last;return '<div class="panel"><h2>Monthly financial results</h2>'+(r?'<table>'+[['Storage revenue',r.storage],['Handling revenue',r.handling],['Warehouse overhead',-r.rent],['Labour',-r.labour],['H&S managers',-r.hs],['H&S incidents',-r.incidentCost],['Interest',-r.interest],['Profit / loss',r.profit]].map(([k,v])=>'<tr><td>'+k+'</td><td>'+money(v)+'</td></tr>').join('')+'</table><h3>Handling</h3><div class="comparison">'+[['Forecast',r.forecast],['Actual demand',r.demand],['Handled',r.handled],['Capacity',r.capacity]].map(([k,v])=>'<div><small>'+k+'</small><strong>'+num(v)+'</strong></div>').join('')+'</div><p class="muted">Missed '+num(r.missed)+' movements.</p>':'<p class="muted">Complete your first month to see results.</p>')+'</div><div class="panel"><h2>Contract book</h2>'+(c.sites.some(s=>committed(s).length)?c.sites.map(s=>committed(s).map(k=>'<div class="contract"><h3>'+esc(k.name)+'</h3><p>'+regionOf(s.region).name+' · '+num(k.spaces)+' spaces · '+num(k.moves)+' moves/month</p><p><b>Storage £'+k.storage+'/pallet/month · Handling £'+k.handling+'/move</b></p><p class="muted">Ends '+monthName(k.end)+'</p></div>').join('')).join(''):'<p class="muted">No active contracts.</p>')+'</div><div class="panel"><h2>Game controls</h2><button class="btn danger" onclick="confirmReset()">Start new game</button><p class="muted">Version 5 uses its own save. Your V4 save remains untouched.</p></div>';}
function confirmReset(){dialog('<h2>Start again?</h2><p>This will replace your Version 4 save.</p><div class="modal-actions"><button class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn danger" onclick="resetGame()">Reset</button></div>')};function resetGame(){state=fresh();selected='mid';selectedSiteId=null;tab='office';save();closeDialog();render()};
function render(){header();document.getElementById('view').innerHTML=({office,market,warehouse,rivals:rivalsView,history})[tab]();}
state=load();save();render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
