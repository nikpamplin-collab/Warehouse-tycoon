function marketGrowth(month){return Math.pow(1+MARKET_ANNUAL_GROWTH,Math.floor(Math.max(0,month-1)/12));}
function economicFactors(g=state){let e=g?.economy||{phase:'steady',months:0},base=ECON[e.phase]||ECON.steady;if(e.phase!=='bust')return base;let depth=Math.min(1,(e.months+1)/9),severity=e.severity??1;return {...base,tenders:1-(1-base.tenders)*depth*severity,volume:1-(1-base.volume)*depth*severity,price:1-(1-base.price)*depth*severity};}

function ensureAssets(s,m){s.automationAssets ||= [];let n=Math.min(s.sections,Math.max(0,Math.floor(s.automated||0)));for(let i=0;i<n;i++)if(!s.automationAssets.some(a=>a.section===i))s.automationAssets.push({section:i,commissioned:m,expires:m+AUTO_LIFE});s.automationAssets=s.automationAssets.filter(a=>a.section>=0&&a.section<s.sections);s.automated=s.automationAssets.length;}

 return state?.player?.sites?.includes(s)?dot19Capacity(s,m,efficiency):Math.round(s.staff*siteProductivity(s,m)*efficiency);

function regionalCycle(g,r){let phase=g.economy?.phase||'steady';return phase==='bust'?({mid:.97,north:.93,south:.97}[r]||1):phase==='boom'?({mid:1.04,north:1.03,south:.97}[r]||1):1;}

function rivalsView(){let firms=all();let rows=[['Warehouse sq ft',c=>num(total(c,s=>s.sections*25000))],['Pallet spaces',c=>num(total(c,siteSpace))],['Pallet spaces booked',c=>num(total(c,occupancy))],['Contracts',c=>num(total(c,s=>committed(s).length))],['Employees',c=>num(total(c,s=>s.staff))],['Monthly profit',c=>c.last?money(c.last.profit):'—'],...(firms.some(c=>!c.last&&c.openingViability)?[['Expected first-month profit',c=>!c.last&&c.openingViability?money(c.openingViability.profit):'—']]:[]),['Cash',c=>cash(c)],['Reputation',c=>face(c.rep)],['Status',c=>c.bankrupt?'Bankrupt':'Trading']];const overview=WTVisual.rivalOverview({regions,rivals:state.rivals.map((r,colour)=>({name:r.name,colour,bankrupt:r.bankrupt,strategy:r.ai?.name,profit:r.last?.profit,openingProfit:r.openingViability?.profit,sites:r.sites.map(s=>({region:s.region,space:siteSpace(s),build:s.projects.length}))}))});return overview+'<div class="panel"><h2>🎯 UK operator comparison</h2><p class="muted">Scroll sideways to compare your business against all active rivals. Rivals invest against demand, cash reserves and profitability targets.</p><div class="table-scroll"><table class="comparison-table"><tr><th>Measure</th>'+firms.map(c=>'<th class="'+(c===state.player?'you':'')+'">'+esc(c.name)+'</th>').join('')+'</tr>'+rows.map(([label,fn])=>'<tr><th>'+label+'</th>'+firms.map(c=>'<td class="'+(c===state.player?'you':'')+'">'+fn(c)+'</td>').join('')+'</tr>').join('')+'</table></div></div>'+state.rivals.map(c=>'<div class="panel"><h2>'+esc(c.name)+' '+face(c.rep)+'</h2><p class="muted">'+(c.bankrupt?'No longer trading.':'Strategy: '+esc(c.ai?.name||'Balanced operator')+' · Profit over the last '+rolling(c).months+' months '+money(rolling(c).profit)+' · Profit as a share of revenue '+(rolling(c).margin*100).toFixed(1)+'% · Last investment: '+(c.lastInvestment?monthName(c.lastInvestment):'Not recorded'))+'</p><div class="sitegrid">'+c.sites.map(miniSite).join('')+'</div><p>Estimated company value: '+fmt(valuation(c))+' · Share you own: '+shares(c)+'%</p>'+(c.bankrupt?'<p class="bad">No longer trading</p>':'<button class="btn secondary" '+(shares(c)>=100?'disabled':'')+' onclick="buyShares(\''+c.name+'\')">Buy 10% shares · '+fmt(Math.ceil(valuation(c)*.1*(shares(c)>=50?1.15:1)/1000)*1000)+'</button><p class="muted">Shares below a controlling stake can earn annual dividends. More than 50% gives control. At 100%, you take over the business, including its debts and other obligations.</p>')+'</div>').join('')+(state.bankruptOffers.length?'<div class="panel"><h2>Warehouses for sale after a closure</h2>'+state.bankruptOffers.map((o,i)=>'<div class="contract"><h3>'+esc(o.name)+'</h3><p>Warehouse assets only. No contracts or debt transferred.</p><button class="btn" onclick="buyAssets('+i+')">Buy warehouses · '+fmt(o.price)+'</button></div>').join('')+'</div>':'');}

ved on this device.</p></div>';}
